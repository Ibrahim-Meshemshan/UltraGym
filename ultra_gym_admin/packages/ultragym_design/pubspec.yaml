name: ultragym_design
description: هوية UltraGym البصرية لـ Flutter - الثيم، الخطوط، الشعار، العناصر الحركية، الحركات، والمكونات.
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/logo/
  fonts:
    - family: Changa
      fonts:
        - asset: assets/fonts/Changa-VariableFont_wght.ttf
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-VariableFont_wght.ttf
