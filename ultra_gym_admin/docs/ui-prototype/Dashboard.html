<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة النادي · الرئيسية · UltraGym v1</title>
<style>
@font-face{font-family:'Changa';src:url(assets/Changa-VariableFont_wght.ttf) format('truetype');font-weight:200 800;font-display:swap}
@font-face{font-family:'Readex Pro';src:url(assets/ReadexPro-VariableFont_wght.ttf) format('truetype');font-weight:160 700;font-display:swap}
body{margin:0;background:var(--bg)}
a{color:var(--p-ink);text-decoration:none}a:hover{color:var(--p-ink2)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.cut{background:var(--line);padding:1px;border-radius:16px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.cut>.in{background:var(--surface);border-radius:15px;clip-path:polygon(0 0,calc(100% - 17.6px) 0,100% 17.6px,100% 100%,0 100%);height:100%;box-sizing:border-box}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.t-success{background:var(--s-soft);color:var(--s-ink)}.t-warning{background:var(--w-soft);color:var(--w-ink)}.t-danger{background:var(--d-soft);color:var(--d-ink)}.t-info{background:var(--i-soft);color:var(--i-ink)}.t-accent{background:var(--a-soft);color:var(--a-ink)}.t-neutral{background:var(--soft);color:var(--muted)}
.btn{height:42px;padding:0 18px;border-radius:10px;font-family:'Readex Pro',sans-serif;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;cursor:pointer;box-sizing:border-box;white-space:nowrap}
.btn-primary{background:var(--primary);color:#1A1A18}.btn-secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}.btn-ghost{background:transparent;color:var(--p-ink);padding:0 8px;height:34px}.btn-ondark{background:transparent;border-color:#45453D;color:#F3F3EE}
.side{background:#1A1A17;color:#C9C9C0;flex:0 0 264px;width:264px;padding:20px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:11.5px;color:#8A8A80;padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;color:#C9C9C0;font-size:13.5px;position:relative}
.nav:hover{background:rgba(255,255,255,.05);color:#F3F3EE}
.nav.on{background:rgba(255,255,255,.10);color:#F3F3EE;font-weight:600}
.nav.on::after{content:'';position:absolute;right:0;top:9px;bottom:9px;width:4px;border-radius:4px;background:#FF5A1F}
.nav.on svg{color:#FF5A1F}
.top{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-family:'Readex Pro',sans-serif;font-size:13px;color:var(--ink);cursor:pointer;box-sizing:border-box}
.iconbtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;position:relative}
.hero{position:relative;overflow:hidden;background:#1A1A17;border-radius:22px;clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,0 100%);color:#F3F3EE}
.speed{position:absolute;inset:0;background-image:url(assets/pattern-speed-tile-dark.svg);background-size:120px 120px;opacity:.10}
.slab{width:36px;height:36px;border-radius:10px;background:var(--p-soft);color:var(--p-ink);display:flex;align-items:center;justify-content:center;transform:skewX(-10deg);flex:0 0 auto}
.slab>svg{transform:skewX(10deg)}
.stat{font-family:'Changa',sans-serif;font-weight:700;font-size:30px;line-height:36px}
.bar{width:100%;clip-path:polygon(0 0,100% 8px,100% 100%,0 100%);background:var(--line);border-radius:0 0 4px 4px}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--divider)}
.av{width:36px;height:36px;border-radius:999px;background:var(--p-soft);color:var(--p-ink);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600;flex:0 0 auto}

.th-light{--bg:#F5F5F2;--surface:#FFFFFF;--soft:#EDEDE8;--line:#E0E0DA;--divider:#EDEDE8;--inv:#1A1A17;--on-inv:#F3F3EE;--ink:#1A1A17;--muted:#5F5F57;--faint:#8A8A80;--primary:#FF5A1F;--p-soft:#FFE8DC;--p-ink:#B53D0A;--p-ink2:#8E2F06;--s-soft:#E3F5EC;--s-ink:#0D7350;--w-soft:#FFF1D1;--w-ink:#8A5800;--d-soft:#FDE6EC;--d-ink:#B81F45;--d-line:#F3C2CF;--i-soft:#E6ECFF;--i-ink:#2A50C8;--a-soft:#EEF8D2;--a-ink:#4F7A00}
.th-dark{--bg:#121210;--surface:#1B1B18;--soft:#24241F;--line:#2E2E29;--divider:#26261F;--inv:#F3F3EE;--on-inv:#1A1A17;--ink:#F3F3EE;--muted:#A9A99F;--faint:#7A7A70;--primary:#FF6A30;--p-soft:#3A1C10;--p-ink:#FF8E5E;--p-ink2:#FFB08A;--s-soft:#163126;--s-ink:#3DD68C;--w-soft:#33280F;--w-ink:#F5B642;--d-soft:#3A1520;--d-ink:#FF7A95;--d-line:#5A2333;--i-soft:#1C2747;--i-ink:#8AA9FF;--a-soft:#263012;--a-ink:#C8F03C}
.th-dark{color-scheme:dark}
.th-dark .tbl tbody tr:hover{background:#24241F}

.sk{background:linear-gradient(90deg,var(--soft,#24241F) 25%,var(--line,#2E2E29) 37%,var(--soft,#24241F) 63%);background-size:400% 100%;animation:skm 1.4s ease infinite;border-radius:8px}
@keyframes skm{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.pse{background:var(--surface,#1B1B18);border:1px solid var(--line,#2E2E29);border-radius:16px;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.pse .ico{width:56px;height:56px;border-radius:999px;background:var(--d-soft,#3A1520);color:var(--d-ink,#FF7A95);display:flex;align-items:center;justify-content:center}
</style>
<link rel="stylesheet" href="proto.css">
</head>
<body>
<div id="dc-root"></div>
<template id="dc-src">
<div class="{{ themeCls }}" style="min-height:1480px;display:flex;flex-wrap:wrap;font-family:'Readex Pro',sans-serif;color:var(--ink);direction:rtl;background:var(--bg)">

  <!-- Sidebar -->
  <nav class="side" aria-label="القائمة الرئيسية">
    <div style="padding:6px 12px 18px;border-bottom:1px solid #2E2E29;margin-bottom:6px"><img src="assets/ultragym-horizontal-dark.svg" alt="UltraGym" style="height:30px"></div>
    <a class="nav on" href="Dashboard.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/></svg>الرئيسية</a>
    <span class="nav-label">التشغيل</span>
    <a class="nav" href="Members.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/></svg>الأعضاء</a>
    <a class="nav" href="Memberships.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>الاشتراكات والديون</a>
    <a class="nav" href="Attendance.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></svg>الحضور</a>
    <span class="nav-label">المالية</span>
    <a class="nav" href="CashSessions.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v12H4zM4 7l2-3h12l2 3M16 13h2"/></svg>الصندوق والحركات</a>
    <a class="nav" href="Payroll.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>الرواتب والسلف</a>
    <a class="nav" href="Reports.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>التقارير</a>
    <span class="nav-label">النادي</span>
    <a class="nav" href="Plans.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>الخطط والكوبونات</a>
    <a class="nav" href="Training.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 12h3M19 12h3M5 8v8M19 8v8M7 12h10"/></svg>المدربون والتدريب</a>
    <a class="nav" href="Announcements.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4h3l7 4V6L6 10zM17 9a4 4 0 0 1 0 6"/></svg>الإعلانات</a>
    <span class="nav-label">الإدارة</span>
    <a class="nav" href="BranchSettings.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>الإعدادات والفروع</a>
    <a class="nav" href="Staff.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16a3 3 0 0 1 6 0M14 10h4M14 14h3"/></svg>الموظفون والحسابات</a>
    <a class="nav" href="ReceptionDevices.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10v18H7zM11 18h2"/></svg>أجهزة الاستقبال</a>
    <a class="nav" href="ClubBilling.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>اشتراك النادي والدعم</a>
    <div style="margin-top:auto;padding:16px 12px 0;border-top:1px solid #2E2E29;display:flex;align-items:center;gap:10px">
      <span style="width:36px;height:36px;border-radius:999px;background:#FF5A1F;color:#1A1A17;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px">س</span>
      <span style="display:flex;flex-direction:column"><strong style="color:#F3F3EE;font-size:13px;font-weight:600">سامر الحلبي</strong><span style="font-size:11.5px;color:#A9A99F">مالك النادي</span></span>
    </div>
  </nav>

  <!-- Content -->
  <div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
    <header class="top">
      <h1 style="margin:0;font-size:24px;line-height:36px;font-weight:600;margin-left:auto">الرئيسية</h1>
      <button class="pill" type="button" aria-label="اختيار الفرع"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>كل الفروع<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <span class="badge t-accent" style="height:30px;padding:0 12px">الصندوق: 1 من 2 مفتوح</span>
      <button class="pill" type="button" style="width:300px;justify-content:flex-start;color:var(--muted)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>ابحث عن عضو بالاسم أو الموبايل أو المعرّف</button>
      <button class="iconbtn" type="button" onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" title="{{ themeLabel }}"><template data-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></template><template data-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></template></button>
      <button class="iconbtn" type="button" aria-label="الإشعارات، 4 غير مقروءة"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg><span style="position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;border-radius:999px;background:#C8F03C;color:#1A1A18;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center">4</span></button>
    </header>

    <template data-if value="{{ showGrace }}" hint-placeholder-val="{{ false }}">
      <div role="status" style="display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--w-soft);color:var(--w-ink);font-size:13px;flex-wrap:wrap"><strong style="font-weight:600">انتهى اشتراك النادي بالمنصة، وأنت بفترة السماح حتى 7 تشرين الثاني.</strong><span>بعدها تصبح اللوحة للقراءة فقط.</span><a href="ClubBilling.html" style="margin-right:auto;color:var(--w-ink);font-weight:600;text-decoration:underline">عرض الفاتورة</a></div>
    </template>
    <template data-if value="{{ showReadOnly }}" hint-placeholder-val="{{ false }}">
      <div role="status" style="display:flex;align-items:center;gap:12px;padding:12px 24px;background:var(--d-soft);color:var(--d-ink);font-size:13px;flex-wrap:wrap"><strong style="font-weight:600">اللوحة للقراءة فقط: انتهى اشتراك النادي بالمنصة.</strong><span>البيع والقبض والتعديل معطّلة حتى التجديد.</span><a href="ClubBilling.html" style="margin-right:auto;color:var(--d-ink);font-weight:600;text-decoration:underline">تواصل مع UltraGym</a></div>
    </template>

    <main style="padding:24px;display:flex;flex-direction:column;gap:20px;max-width:1240px;width:100%;box-sizing:border-box">
<template data-if value="{{ psReady }}" hint-placeholder-val="{{ true }}"><div style="display:contents">

      <!-- Hero -->
      <section class="hero" style="min-height:168px;padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap">
        <div class="speed" aria-hidden="true"></div>
        <img src="assets/plate-ring-dark.svg" alt="" aria-hidden="true" style="position:absolute;left:-40px;top:-36px;width:240px;height:240px;opacity:.3">
        <div aria-hidden="true" style="position:absolute;left:190px;top:-20px;bottom:-20px;width:14px;background:var(--primary);transform:skewX(-10deg)"></div>
        <div aria-hidden="true" style="position:absolute;left:212px;top:-20px;bottom:-20px;width:4px;background:#C8F03C;transform:skewX(-10deg)"></div>
        <div style="position:relative;display:flex;flex-direction:column;gap:8px">
          <span style="align-self:flex-start;background:var(--primary);color:#1A1A18;font-size:12px;font-weight:600;padding:3px 12px;transform:skewX(-10deg)"><span style="display:inline-block;transform:skewX(10deg)">الأربعاء 4 تشرين الثاني</span></span>
          <h2 style="margin:0;font-family:'Changa',sans-serif;font-weight:700;font-size:32px;line-height:42px">صباح الخير، سامر</h2>
          <p style="margin:0;font-size:14px;line-height:24px;color:#C9C9C0">نادي القمة الرياضي · 214 دخول اليوم · 6 اشتراكات مبيعة</p>
        </div>
        <div style="position:relative;display:flex;gap:10px;margin-left:260px">
          <a class="btn btn-primary" href="SellMembership.html"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>بيع اشتراك</a>
          <a class="btn btn-ondark" href="Reception.html">تسجيل دخول عضو</a>
        </div>
      </section>

      <!-- Stats -->
      <section style="display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px" aria-label="أرقام اليوم">
        <div class="cut"><div class="in" style="padding:18px 20px;display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;color:var(--muted)">الأعضاء</span><span class="slab"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7"/></svg></span></div>
          <span class="stat ltr" style="text-align:right">1,284</span>
          <span style="font-size:12px;color:var(--s-ink)">+38 عضوًا جديدًا هذا الشهر</span>
        </div></div>
        <div class="cut"><div class="in" style="padding:18px 20px;display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;color:var(--muted)">الاشتراكات الفعّالة</span><span class="slab"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg></span></div>
          <span class="stat ltr" style="text-align:right">962</span>
          <span style="font-size:12px;color:var(--muted)">مجمّدة 14 · بالسماح 23</span>
        </div></div>
        <div class="cut"><div class="in" style="padding:18px 20px;display:flex;flex-direction:column;gap:8px">
          <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;color:var(--muted)">دخول اليوم</span><span class="slab"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></svg></span></div>
          <span class="stat ltr" style="text-align:right">214</span>
          <span style="font-size:12px;color:var(--muted)">مرفوض 9 · <span class="ltr">3,870</span> هذا الشهر</span>
        </div></div>
        <div class="cut"><div class="in" style="padding:18px 20px;display:flex;flex-direction:column;gap:8px">
