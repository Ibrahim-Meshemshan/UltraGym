<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة النادي · إعدادات الفرع · UltraGym v1</title>
<style>
@font-face{font-family:'Changa';src:url(assets/Changa-VariableFont_wght.ttf) format('truetype');font-weight:200 800;font-display:swap}
@font-face{font-family:'Readex Pro';src:url(assets/ReadexPro-VariableFont_wght.ttf) format('truetype');font-weight:160 700;font-display:swap}
body{margin:0;background:var(--bg)}
a{color:var(--p-ink);text-decoration:none}a:hover{color:var(--p-ink2)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.cut{background:var(--line);padding:1px;border-radius:16px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.cut>.in{background:var(--surface);border-radius:15px;clip-path:polygon(0 0,calc(100% - 17.6px) 0,100% 17.6px,100% 100%,0 100%);height:100%;box-sizing:border-box}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.t-success{background:var(--s-soft);color:var(--s-ink)}.t-warning{background:var(--w-soft);color:var(--w-ink)}.t-danger{background:var(--d-soft);color:var(--d-ink)}.t-info{background:var(--i-soft);color:var(--i-ink)}.t-accent{background:var(--a-soft);color:var(--a-ink)}.t-neutral{background:var(--soft);color:var(--muted)}
.btn{height:42px;padding:0 18px;border-radius:10px;font-family:'Readex Pro',sans-serif;font-size:13px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;cursor:pointer;box-sizing:border-box;white-space:nowrap}
.btn-primary{background:var(--primary);color:#1A1A18}.btn-secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}.btn-ghost{background:transparent;color:var(--p-ink);padding:0 8px;height:34px}
.side{background:#1A1A17;color:#C9C9C0;flex:0 0 264px;width:264px;padding:20px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:4px}
.nav-label{font-size:11.5px;color:#8A8A80;padding:14px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:10px;color:#C9C9C0;font-size:13.5px;position:relative}
.nav:hover{background:rgba(255,255,255,.05);color:#F3F3EE}
.nav.on{background:rgba(255,255,255,.10);color:#F3F3EE;font-weight:600}
.nav.on::after{content:'';position:absolute;right:0;top:9px;bottom:9px;width:4px;border-radius:4px;background:#FF5A1F}
.nav.on svg{color:#FF5A1F}
.top{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-family:'Readex Pro',sans-serif;font-size:13px;color:var(--ink);cursor:pointer;box-sizing:border-box;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;position:relative}
.ctabs{display:flex;gap:24px;border-bottom:1px solid var(--line)}
.ctab{height:40px;padding:0 4px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;display:flex;align-items:center}
.ctab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--primary)}
.cur{flex:1 1 300px;min-width:0;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.ln{display:flex;justify-content:space-between;font-size:14px}
.ln span:first-child{color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:960px}
.tbl th{background:var(--soft);color:var(--muted);font-weight:500;font-size:12.5px;text-align:right;padding:10px 14px;white-space:nowrap}
.tbl td{padding:12px 14px;border-top:1px solid var(--divider)}
.input{height:50px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font-family:'Readex Pro',sans-serif;font-size:18px;color:var(--ink);box-sizing:border-box;width:100%}
.lbl{font-size:12.5px;font-weight:500;color:var(--muted)}
.dlg{background:var(--surface);border-radius:16px;box-shadow:0 24px 60px rgba(26,26,23,.16);width:100%;max-width:640px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.sel{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-family:'Readex Pro',sans-serif;font-size:14px;color:var(--ink);box-sizing:border-box;width:100%}
.fi{display:flex;flex-direction:column;gap:6px;min-width:0}
.brn{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--divider);color:var(--ink);position:relative}
.brn.on{background:var(--p-soft)}
.brn.on::after{content:'';position:absolute;right:0;top:10px;bottom:10px;width:4px;border-radius:4px;background:var(--primary)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{height:38px;padding:0 18px;border-radius:8px;border:0;background:transparent;font-family:'Readex Pro',sans-serif;font-size:13.5px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(26,26,23,.08)}
.chip{height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-family:'Readex Pro',sans-serif;font-size:12.5px;color:var(--muted);cursor:pointer}
.chip.on{background:var(--inv);border-color:var(--inv);color:var(--on-inv)}
.slot{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.tm{height:40px;width:100px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-family:'Readex Pro',sans-serif;font-size:15px;text-align:center;box-sizing:border-box}
.sw{width:40px;height:24px;border-radius:999px;background:var(--primary);position:relative;display:inline-block}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#FFFFFE}

.th-light{--bg:#F5F5F2;--surface:#FFFFFF;--soft:#EDEDE8;--line:#E0E0DA;--divider:#EDEDE8;--inv:#1A1A17;--on-inv:#F3F3EE;--ink:#1A1A17;--muted:#5F5F57;--faint:#8A8A80;--primary:#FF5A1F;--p-soft:#FFE8DC;--p-ink:#B53D0A;--p-ink2:#8E2F06;--s-soft:#E3F5EC;--s-ink:#0D7350;--w-soft:#FFF1D1;--w-ink:#8A5800;--d-soft:#FDE6EC;--d-ink:#B81F45;--d-line:#F3C2CF;--i-soft:#E6ECFF;--i-ink:#2A50C8;--a-soft:#EEF8D2;--a-ink:#4F7A00}
.th-dark{--bg:#121210;--surface:#1B1B18;--soft:#24241F;--line:#2E2E29;--divider:#26261F;--inv:#F3F3EE;--on-inv:#1A1A17;--ink:#F3F3EE;--muted:#A9A99F;--faint:#7A7A70;--primary:#FF6A30;--p-soft:#3A1C10;--p-ink:#FF8E5E;--p-ink2:#FFB08A;--s-soft:#163126;--s-ink:#3DD68C;--w-soft:#33280F;--w-ink:#F5B642;--d-soft:#3A1520;--d-ink:#FF7A95;--d-line:#5A2333;--i-soft:#1C2747;--i-ink:#8AA9FF;--a-soft:#263012;--a-ink:#C8F03C}
.th-dark{color-scheme:dark}
.th-dark .tbl tbody tr:hover{background:#24241F}

.sk{background:linear-gradient(90deg,var(--soft,#24241F) 25%,var(--line,#2E2E29) 37%,var(--soft,#24241F) 63%);background-size:400% 100%;animation:skm 1.4s ease infinite;border-radius:8px}
@keyframes skm{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.pse{background:var(--surface,#1B1B18);border:1px solid var(--line,#2E2E29);border-radius:16px;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.pse .ico{width:56px;height:56px;border-radius:999px;background:var(--d-soft,#3A1520);color:var(--d-ink,#FF7A95);display:flex;align-items:center;justify-content:center}
</style>
<link rel="stylesheet" href="proto.css">
</head>

<template id="dc-src">
<div class="{{ themeCls }}" style="min-height:1180px;display:flex;flex-wrap:wrap;font-family:'Readex Pro',sans-serif;color:var(--ink);direction:rtl;background:var(--bg);position:relative">

  <nav class="side" aria-label="القائمة الرئيسية">
    <div style="padding:6px 12px 18px;border-bottom:1px solid #2E2E29;margin-bottom:6px"><img src="assets/ultragym-horizontal-dark.svg" alt="UltraGym" style="height:30px"></div>
    <a class="nav" href="Dashboard.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/></svg>الرئيسية</a>
    <span class="nav-label">التشغيل</span>

    <a class="nav" href="Memberships.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>الاشتراكات والديون</a>
    <a class="nav" href="Attendance.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></svg>الحضور</a>
    <span class="nav-label">المالية</span>
    <a class="nav" href="CashSessions.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v12H4zM4 7l2-3h12l2 3M16 13h2"/></svg>الصندوق والحركات</a>
    <a class="nav" href="Payroll.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>الرواتب والسلف</a>
    <a class="nav" href="Reports.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>التقارير</a>
    <span class="nav-label">النادي</span>
    <a class="nav" href="Plans.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>الخطط والكوبونات</a>
    <a class="nav" href="Training.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 12h3M19 12h3M5 8v8M19 8v8M7 12h10"/></svg>المدربون والتدريب</a>
    <a class="nav" href="Announcements.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4h3l7 4V6L6 10zM17 9a4 4 0 0 1 0 6"/></svg>الإعلانات</a>
    <span class="nav-label">الإدارة</span>
    <a class="nav on" href="BranchSettings.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>الإعدادات والفروع</a>
    <a class="nav" href="Staff.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16a3 3 0 0 1 6 0M14 10h4M14 14h3"/></svg>الموظفون والحسابات</a>
    <a class="nav" href="ReceptionDevices.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10v18H7zM11 18h2"/></svg>أجهزة الاستقبال</a>
    <a class="nav" href="ClubBilling.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>اشتراك النادي والدعم</a>
    <div style="margin-top:auto;padding:16px 12px 0;border-top:1px solid #2E2E29;display:flex;align-items:center;gap:10px">
      <span style="width:36px;height:36px;border-radius:999px;background:#FF5A1F;color:#1A1A17;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px">س</span>
      <span style="display:flex;flex-direction:column"><strong style="color:#F3F3EE;font-size:13px;font-weight:600">سامر الحلبي</strong><span style="font-size:11.5px;color:#A9A99F">مالك النادي</span></span>
    </div>
  </nav>

  <div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
    <header class="top">
      <h1 style="margin:0;font-size:24px;line-height:36px;font-weight:600;margin-left:auto">الإعدادات والفروع</h1>
      
      <button class="pill" type="button" aria-label="الفرع"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s7-6.2 7-12a7 7 0 0 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="9" r="2.5"/></svg>الفرع الرئيسي – المزة<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button>
      <button class="iconbtn" type="button" onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" title="{{ themeLabel }}"><template data-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></template><template data-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></template></button>
      <button class="iconbtn" type="button" aria-label="الإشعارات"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg></button>
    </header>

    <main style="padding:24px;display:flex;flex-direction:column;gap:16px;max-width:1240px;width:100%;box-sizing:border-box">
<template data-if value="{{ psReady }}" hint-placeholder-val="{{ true }}"><div style="display:contents">
      <nav class="ctabs" aria-label="أقسام الإعدادات"><a class="ctab" href="ClubSettings.html">النادي</a><a class="ctab on" href="BranchSettings.html" aria-current="page">الفروع</a></nav>
      <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start">
        <section class="cut" style="flex:1 1 260px;min-width:0;max-width:320px"><div class="in" style="display:flex;flex-direction:column">
          <div style="display:flex;justify-content:space-between;align-items:center;padding:14px 16px"><h2 style="margin:0;font-size:15px;font-weight:600">الفروع <span style="color:var(--muted);font-weight:400;font-size:13px">2 من 3</span></h2><button class="btn btn-ghost" type="button">+ فرع</button></div>
          <a class="brn on" href="#"><span style="flex:1;display:flex;flex-direction:column"><strong style="font-size:14px;font-weight:600">الفرع الرئيسي – المزة</strong><span style="font-size:12px;color:var(--muted)">رئيسي · {{ policyShort }}</span></span><span class="badge t-success">فعّال</span></a>
          <a class="brn" href="#"><span style="flex:1;display:flex;flex-direction:column"><strong style="font-size:14px;font-weight:600">فرع المالكي</strong><span style="font-size:12px;color:var(--muted)">مختلط</span></span><span class="badge t-success">فعّال</span></a>
        </div></section>

        <form style="flex:3 1 640px;min-width:0;display:flex;flex-direction:column;gap:16px" onSubmit="{{ noop }}">
          <section class="cut"><div class="in" style="padding:22px 24px;display:flex;flex-direction:column;gap:16px">
            <h2 style="margin:0;font-size:17px;line-height:28px;font-weight:600">بيانات الفرع</h2>
            <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px">
              <div class="fi"><label class="lbl" for="b-n">اسم الفرع</label><input id="b-n" class="sel" value="الفرع الرئيسي – المزة"></div>
              <div class="fi"><label class="lbl" for="b-p">الهاتف</label><input id="b-p" class="sel" dir="ltr" style="text-align:right" value="+963 11 611 2233"></div>
              <div class="fi"><label class="lbl" for="b-c">المدينة</label><input id="b-c" class="sel" value="دمشق"></div>
              <div class="fi"><label class="lbl" for="b-a">العنوان</label><input id="b-a" class="sel" value="المزة، شارع الجلاء، بناء 14"></div>
            </div>
            <div style="display:flex;gap:24px;flex-wrap:wrap;align-items:center;font-size:14px">
              <label style="display:flex;align-items:center;gap:10px"><span class="sw" aria-hidden="true"></span>الفرع الرئيسي</label>
              <label style="display:flex;align-items:center;gap:10px"><span class="sw" aria-hidden="true"></span>فعّال</label>
              <span style="font-size:12.5px;color:var(--muted)">لا يُحذف فرع عليه حركات؛ يمكن إيقافه.</span>
            </div>
          </div></section>

          <section class="cut"><div class="in" style="padding:22px 24px;display:flex;flex-direction:column;gap:16px">
            <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
              <div><h2 style="margin:0;font-size:17px;line-height:28px;font-weight:600">أقسام الذكور والإناث</h2><p style="margin:0;font-size:13px;color:var(--muted)">بتوقيت النادي. الاستقبال يرفض الدخول خارج وقت قسم العضو.</p></div>
              <div class="seg" role="group" aria-label="نظام الدخول"><button type="button" class="{{ mixedCls }}" onClick="{{ toMixed }}">مختلط</button><button type="button" class="{{ splitCls }}" onClick="{{ toSplit }}">أوقات منفصلة</button></div>
            </div>

            <template data-if value="{{ isMixed }}" hint-placeholder-val="{{ false }}">
              <div style="background:var(--soft);border-radius:12px;padding:14px 16px;font-size:13.5px;color:var(--muted)">الدخول للجميع بكل الأوقات. هذا هو الافتراضي.</div>
            </template>

            <template data-if value="{{ isSplit }}" hint-placeholder-val="{{ true }}">
              <div style="display:flex;flex-direction:column;gap:12px">
                <template data-for list="{{ slots }}" as="s" hint-placeholder-count="3">
                  <div class="slot">
                    <div style="display:flex;gap:6px;flex-wrap:wrap" role="group" aria-label="الأيام">
                      <template data-for list="{{ s.days }}" as="d" hint-placeholder-count="7"><button type="button" class="{{ d.cls }}" aria-pressed="{{ d.on }}">{{ d.l }}</button></template>

<script type="application/json" id="dc-props">{"policy": {"editor": "enum", "options": ["time_split", "mixed"], "default": "time_split", "section": "نظام الدخول"}, "theme": {"editor": "enum", "options": ["light", "dark"], "default": "light", "section": "المظهر"}, "pageState": {"editor": "enum", "options": ["ready", "loading", "error"], "default": "ready", "section": "حالة الصفحة"}, "$preview": {"width": 1440, "height": 1180}}</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const base = this.__ps();
    const ps = (this.state && this.state.__ps) || this.props.pageState || 'ready';
    return Object.assign({}, base, { psReady: ps === 'ready', psLoading: ps === 'loading', psError: ps === 'error', psRetry: () => this.setState({ __ps: 'ready' }) });
  }
  __ps() {
    const v = this.__rv();
    const th = (this.state && this.state.__th) || this.props.theme || 'light';
    return Object.assign({}, v, { themeCls: 'th th-' + th, isDark: th === 'dark', isLight: th !== 'dark', themeLabel: th === 'dark' ? 'التبديل للوضع الفاتح' : 'التبديل للوضع الداكن', toggleTheme: () => this.setState({ __th: th === 'dark' ? 'light' : 'dark' }) });
  }
  __rv() {
    const p = (this.state && this.state.policy) || this.props.policy || 'time_split';
    const split = p === 'time_split';
    const D = ['السبت','الأحد','الإثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
    const days = (onIdx) => D.map((l, i) => ({ l, on: onIdx.includes(i) ? 'true' : 'false', cls: onIdx.includes(i) ? 'chip on' : 'chip' }));
    const G = [['female','إناث'],['male','ذكور'],['mixed','مختلط']];
    const g = (k) => G.map(([v, l]) => ({ l, cls: v === k ? 'on' : '' }));
    const slot = (idx, from, to, gender) => ({ days: days(idx), from, to, g: g(gender), overnight: to < from });
    return {
      isSplit: split,
      isMixed: !split,
      policyShort: split ? 'أوقات منفصلة' : 'مختلط',
      splitCls: split ? 'on' : '',
      mixedCls: split ? '' : 'on',
      toSplit: () => this.setState({ policy: 'time_split' }),
      toMixed: () => this.setState({ policy: 'mixed' }),
      noop: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      slots: [
        slot([0,1,2,3,4,5], '08:00', '14:00', 'female'),
        slot([0,1,2,3,4,5], '16:00', '01:00', 'male'),
        slot([6], '10:00', '20:00', 'mixed')
      ]
    };
  }
}
