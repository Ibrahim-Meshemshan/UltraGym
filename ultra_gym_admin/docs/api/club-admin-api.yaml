    post:
      tags:
      - Club Admin - Attendance & Sessions
      operationId: clubPostAttendanceCheckIn
      summary: تسجيل دخول لاعب
      description: '**الصلاحية:** المالك وموظف الاستقبال (بفروعه).


        حدد اللاعب بواحد من: `player_id` (اختيار يدوي)، `member_code` (المعرّف أو الباركود)، `qr_token` (رمز تطبيق اللاعب `UG1.{key_id}.{unix}.{sig}` موقّع Ed25519 وصالح 30 ثانية).


        - **مقبول:** `201`، ومع `in_grace = true` إن كان الاشتراك منتهياً ضمن أيام السماح.

        - **مكرر** خلال `duplicate_check_in_minutes` (افتراضياً 120): `200` مع `code = ALREADY_CHECKED_IN` والسجل السابق.

        - **مرفوض:** `409` و`code` هو السبب: `NO_MEMBERSHIP` `EXPIRED` `FROZEN` `UPCOMING` `BRANCH_NOT_ALLOWED` `NO_SESSIONS` `SUSPENDED` `GENDER_HOURS` (ليس وقت قسم اللاعب بفرع أوقات
        منفصلة) `GENDER_UNKNOWN` (جنس اللاعب غير محدد بفرع أوقات منفصلة)، والسجل يُحفظ مرفوضاً ويرجع بـ `data`.

        - **QR غير صالح:** `422` بـ `QR_EXPIRED` `QR_INVALID` `QR_MALFORMED` `QR_UNKNOWN_KEY` دون حفظ.

        - `consume_session = true` يستهلك جلسة مع الدخول لاشتراكات الجلسات.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                member_code:
                  type: string
                client_uuid:
                  type: string
                qr_token:
                  type: string
                player_id:
                  type: integer
                consume_session:
                  type: boolean
              required:
              - member_code
              - player_id
              - qr_token
            examples:
