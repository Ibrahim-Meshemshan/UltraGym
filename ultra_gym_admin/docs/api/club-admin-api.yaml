  /reception/sync:
    post:
      tags:
      - Club Admin - Reception Offline
      operationId: clubPostReceptionSync
      summary: مزامنة العمليات المسجلة أوفلاين
      description: '**الصلاحية:** المالك وموظف الاستقبال (بفروعه).


        العمليات المسجلة أوفلاين (حتى 500)، لكل منها `client_uuid` ثابت يولّده الجهاز: إعادة الإرسال ترجع `duplicate` ولا تكرر.


        الأنواع و`data`:

        - `check_in`: `{player_id, method, consume_session?}`

        - `consume_session`: `{membership_id, note?}`

        - `membership_payment`: `{membership_id, payments:[{currency, amount}]}`

        - `create_membership`: `{player_id, plan_id, payments, starts_on?, coupon_code?, trainer_id?, previous_membership_id?}`

        - `day_pass`: `{visitor_name, visitor_phone?, gender?, payments}` لزائر أو `{player_id, payments}` للاعب (السعر من `day_pass.price_usd` بالحزمة)


        تُطبَّق بترتيب `occurred_at`، وكل عملية وحدها: `applied` أو `duplicate` أو `rejected` (مع `code` و`message`) أو `failed` (أعد المحاولة). الدفعات أوفلاين تُقبل حتى لو كان الصندوق
        مغلقاً وتُربط بالوردية المفتوحة إن وُجدت.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                device_uuid:
                  type: string
                operations:
                  type: array
                  items:
                    type: object
                    properties:
                      client_uuid:
                        type: string
                      type:
                        type: string
                      occurred_at:
                        type: string
                        format: date-time
                      data:
                        type: object
                        properties:
                          player_id:
                            type: integer
                          method:
                            type: string
              required:
              - device_uuid
              - operations
            examples:
              ex1:
                summary: مزامنة
                value:
                  device_uuid: 1066b1c6-1546-493e-b550-87786ebfcd9c
                  operations:
                  - client_uuid: eeee405a-cd4f-45f8-a30e-651ee0a8d8b5
                    type: check_in
                    occurred_at: '2026-11-10T07:05:00Z'
                    data:
                      player_id: 5
                      method: qr
                  - client_uuid: d123e8b2-2ed5-416b-8ece-7396ad2958ea
                    type: membership_payment
                    occurred_at: '2026-11-10T07:06:00Z'
                    data:
                      membership_id: 2
                      payments:
                      - currency: SYP
                        amount: 65000
                  - client_uuid: 29d021a2-4030-477e-8eb8-12cc94b1a854
                    type: create_membership
                    occurred_at: '2026-11-10T07:10:00Z'
                    data:
                      player_id: 7
                      plan_id: 1
                      payments:
                      - currency: USD
                        amount: 27.5
                  - client_uuid: 302f6876-968d-4294-9942-9ebc1ba69d2b
                    type: consume_session
                    occurred_at: '2026-11-10T07:12:00Z'
                    data:
                      membership_id: 2
                  - client_uuid: 9483ca73-ebf7-48d9-9cd0-33c20e5431c4
                    type: day_pass
                    occurred_at: '2026-11-10T07:15:00Z'
                    data:
                      visitor_name: زائر بدون اتصال
                      payments:
                      - currency: USD
                        amount: 5
