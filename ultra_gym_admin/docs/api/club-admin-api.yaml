openapi: 3.0.3
info:
  title: UltraGym - Club Admin API
  version: 1.0.0
  description: 'واجهات لوحة النادي (Flutter Web) لمالك النادي (`club_owner`) وموظف الاستقبال (`receptionist`). كل المسارات تحت `/api/v1/club-admin`، والدخول من `POST /api/v1/auth/login`
    (التوكن يحمل النادي).


    **نظام إدارة ومحاسبة معاً:**

    - **العملتان:** الدولار عملة الحساب (`*_usd`)، والليرة السورية بسعر صرف يحدده النادي (`finance/exchange-rate`). كل حركة تُخزَّن بعملتها وسعر صرفها وقيمتها بالدولار وقت حدوثها، والردود
    تعرض ما يقابل المستحقات بالليرة (`*_syp`) بالسعر الحالي.

    - **الدفع نقدي** بالدولار أو الليرة أو بالعملتين معاً. الدفع الجزئي يفعّل الاشتراك والباقي **دين** (`due_usd`) يظهر بـ `memberships/debts`.

    - **دفتر واحد غير قابل للتعديل** (`transactions`): قبض الاشتراكات، الاسترجاع، الإيرادات، المصاريف، الرواتب، السلف. التصحيح **بعكس** الحركة فقط. لكل حركة رقم إيصال متسلسل لكل فرع
    وسنة (`B1-2026-000123`).

    - **ورديات الصندوق** لكل فرع بالدولار والليرة: كل قبض أو صرف يحتاج وردية مفتوحة (`409 CASH_SESSION_REQUIRED`)، والإغلاق بالجرد الفعلي يحسب الفرق.

    - **يوم العمل** بتوقيت النادي (Asia/Damascus) ينتهي بساعة `business_day_ends_at_hour` (افتراضياً 2 فجراً): حركات ما بعد منتصف الليل تُحسب على اليوم السابق (`business_date`).


    **الأدوار والعزل:**

    - المالك: كل شيء. موظف الاستقبال: اللاعبون، البيع والقبض، الحضور، صناديق **فروعه فقط**، والمصاريف النثرية. للمالك فقط: إدارة الموظفين، الرواتب والسلف، عكس الحركات، إلغاء الاشتراكات،
    الخصم اليدوي، الخطط والكوبونات وسعر الصرف، التقارير المالية، وأرشفة اللاعبين.

    - فرع خارج صلاحية الموظف: `403 BRANCH_FORBIDDEN`. بيانات نادٍ آخر: `404` دائماً (عزل بالكود وبـ PostgreSQL Row-Level Security).

    - الميزات حسب خطة النادي: `advanced_finance` (الرواتب)، `offline_reception` (الاستقبال أوفلاين)، `advanced_reports` (مقارنة الفروع)، `reports_export` (PDF وExcel). غير المتاحة: `403
    FEATURE_NOT_AVAILABLE`.

    - حدود الخطة (اللاعبون، الموظفون، الفروع): `403 PLAN_LIMIT_REACHED`.


    **شكل الرد (كل الحالات):**

    - نجاح: `{ success: true, message, data, meta? }` و`meta.pagination` بالقوائم.

    - خطأ: `{ success: false, message, code, errors?, data? }`. اعتمد على `code` لا على نص الرسالة. `errors` مع `422`.

    - اشتراك النادي بالمنصة: بعد المهلة قراءة فقط (`403 SUBSCRIPTION_EXPIRED` لأي تعديل) ثم قفل كامل (`403 SUBSCRIPTION_LOCKED`).


    **العمل دون إنترنت:** شاشة الاستقبال تحمّل `reception/offline-pack` وتتحقق محلياً من الدخول ورموز QR (Ed25519)، وتسجّل العمليات بـ `client_uuid` ثم ترسلها لـ `reception/sync` دون
    تكرار.


    **الحجم والأداء (مُختبر على 100 ألف نادٍ، 1.15 مليون حساب، 10 ملايين دخول، مليوني حركة):**

    - كل قائمة مقسّمة (`page`، `per_page` حتى 100) أو بمؤشر (`offline-pack`). سجلا الحضور والحركات بنافذة افتراضية 31 يوماً.

    - تقارير القوائم الطويلة (الديون، المنتهية) مقسّمة بـ JSON، وExcel يُكتب تدريجياً بلا حد، وPDF أول 2000 سطر.

    - حدود الطلبات: لكل مستخدم 120/دقيقة، ولكل نادٍ 1500/دقيقة (`429 TOO_MANY_REQUESTS`)، وحد زمني لكل استعلام بطلبات النوادي (20 ثانية).


    **العزل:** حتى عضويات النوادي ومعرّفات الدخول تحت Row-Level Security؛ أي معرّف لنادٍ آخر بأي مسار = `404`.


    كل الأمثلة بهذا الملف ردود حقيقية من الخادم.'
servers:
- url: /api/v1/club-admin
security:
- sanctum: []
tags:
- name: Club Admin - Dashboard
  description: 'اللوحة الرئيسية: أرقام اليوم والشهر، الصناديق، التنبيهات. الأرقام المالية للمالك فقط.'
- name: Club Admin - Club & Settings
  description: ملف النادي والشعار وإعدادات التشغيل (أيام السماح، التجميد، منع التكرار، نهاية يوم العمل، الدفع الجزئي) والأرشيف.
- name: Club Admin - Branches
  description: فروع النادي (محدودة بخطة النادي). موظف الاستقبال يرى فروعه فقط.
- name: Club Admin - Players
  description: 'اللاعبون: حساب واحد لكل رقم، معرّف دخول بالبادئة، كلمة سر مؤقتة مع رسالة واتساب، ملف اللاعب بالنادي، وبحث الاستقبال السريع.'
- name: Club Admin - Measurements
  description: قياسات جسم اللاعب الدورية مع التقدم و BMI.
- name: Club Admin - Membership Plans
  description: 'خطط الاشتراك: بالمدة أو بالجلسات، لكل الفروع أو لفروع محددة، وتدريب خاص بمدرب.'
- name: Club Admin - Coupons
  description: كوبونات الخصم (نسبة أو مبلغ) على الاشتراكات.
- name: Club Admin - Memberships & Debts
  description: بيع وتجديد الاشتراكات، الدفعات بالدولار والليرة، الدفع الجزئي والديون، التجميد، الإلغاء مع الاسترجاع، والفاتورة.
- name: Club Admin - Attendance & Sessions
  description: دخول اللاعبين (QR موقّع، المعرّف/الباركود، يدوي)، منع التكرار، أيام السماح، واستهلاك الجلسات المنفصل عن الدخول.
- name: Club Admin - Day Passes
  description: 'الدخول اليومي: زائر بلا حساب أو لاعب بلا اشتراك يدفع ويدخل ليوم واحد. السعر من النادي أو الفرع، والدفعة بالصندوق.'
- name: Club Admin - Reception Offline
  description: 'الاستقبال دون إنترنت: تسجيل الجهاز، حزمة البيانات، والمزامنة دون تكرار.'
- name: Club Admin - Cash Box
  description: 'ورديات الصندوق لكل فرع بالدولار والليرة: الافتتاح، الأرصدة الحية، الإغلاق بالجرد والفرق، والتقرير المطبوع.'
- name: Club Admin - Ledger & Transactions
  description: 'دفتر النادي الموحد غير القابل للتعديل: القبض، الصرف، الإيرادات والمصاريف، العكس، والإيصال المطبوع.'
- name: Club Admin - Exchange Rate & Categories
  description: سعر صرف الدولار بالليرة (مع السجل) وتصنيفات المصاريف والإيرادات.
- name: Club Admin - Staff & Trainers
  description: 'المدربون والعمال: سجلات بلا حساب دخول، براتب وعمولة (نسبة أو مبلغ ثابت يقرره المالك).'
- name: Club Admin - Payroll
  description: السلف ومعاينة ودفع الرواتب مع العمولات وخصم السلف (يقرره المالك). تتطلب ميزة advanced_finance.
- name: Club Admin - Receptionists
  description: حسابات موظفي الاستقبال وفروعهم (للمالك).
- name: Club Admin - Workout Plans
  description: 'برامج التدريب: قوالب عامة وبرامج للاعبين. `source = player` للبرامج التي أضافها اللاعب بنفسه من التطبيق.'
- name: Club Admin - Announcements
  description: إعلانات النادي للاعبيه بتطبيق اللاعب.
- name: Club Admin - Reports
  description: 'تقارير الإدارة والمحاسبة: JSON للعرض، PDF للطباعة، Excel للتصدير.'
- name: Club Admin - Accounts
  description: 'كل حسابات النادي وحالة تفعيلها: إعادة كلمات السر فردياً وجماعياً، بطاقات الدخول، المعرّف الجديد، وإنهاء الجلسات.'
- name: Club Admin - Platform Billing
  description: اشتراك النادي بالمنصة وفواتيرها (قراءة وطباعة).
- name: Club Admin - Support
  description: تذاكر الدعم الفني مع فريق المنصة.
- name: Club Admin - Activity Log
  description: من فعل ماذا ومتى داخل النادي.
- name: Club Admin - Profile
  description: ملفي الشخصي وجلساتي على الأجهزة.
paths:
  /dashboard:
    get:
      tags:
      - Club Admin - Dashboard
      operationId: clubGetDashboard
      summary: اللوحة الرئيسية
      description: '**الصلاحية:** المالك وموظف الاستقبال (بفروعه).'
      parameters:
      - name: branch_id
        in: query
        required: false
        schema:
          type: integer
        description: فرع محدد (افتراضياً كل الفروع المسموحة)
      responses:
        '200':
          description: نجاح
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ClubSuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        business_date:
                          type: string
                          format: date
                        exchange_rate:
                          type: number
                        players:
                          type: object
                          properties:
                            total:
                              type: number
                            new_this_month:
                              type: integer
                        memberships:
                          type: object
                          properties:
                            active:
                              type: integer
                            frozen:
                              type: integer
                            expiring_7_days:
                              type: integer
                            in_grace:
                              type: integer
                            sold_today:
                              type: integer
                            sold_this_month:
                              type: integer
                        attendance:
                          type: object
                          properties:
                            today:
                              type: integer
                            rejected_today:
                              type: integer
                            this_month:
                              type: integer
                            visitors_today:
                              type: integer
                        day_passes:
                          type: object
                          properties:
                            today:
                              type: integer
                            this_month:
                              type: integer
                        debts:
                          type: object
                          properties:
                            total_due_usd:
                              type: number
                            players:
                              type: integer
                            total_due_syp:
                              type: number
                        cash_sessions:
                          type: array
                          items:
                            type: object
                            properties:
                              branch:
                                type: object
                                properties:
                                  id:
                                    type: integer
                                  name:
                                    type: string
                              is_open:
                                type: boolean
                              session_id:
                                type: string
                                nullable: true
                              opened_at:
                                type: string
                                nullable: true
                              balance:
                                type: string
                                nullable: true
                        finance:
                          type: object
                          properties:
                            revenue_today_usd:
                              type: number
                            revenue_month_usd:
                              type: number
                            expenses_month_usd:
                              type: number
                            net_month_usd:
                              type: number
                            revenue_last_14_days:
                              type: array
                              items:
                                type: object
                                properties:
                                  date:
                                    type: string
                                    format: date
                                  revenue_usd:
                                    type: number
                        alerts:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                              message:
                                type: string
              examples:
                case1:
                  summary: لوحة المالك
                  value:
                    success: true
                    message: لوحة النادي
                    data:
                      business_date: '2026-11-10'
                      exchange_rate: 13000
                      players:
                        total: 4
                        new_this_month: 4
                      memberships:
                        active: 3
                        frozen: 0
                        expiring_7_days: 0
                        in_grace: 0
                        sold_today: 5
                        sold_this_month: 5
                      attendance:
                        today: 5
                        rejected_today: 1
                        this_month: 5
                        visitors_today: 2
                      day_passes:
                        today: 3
                        this_month: 3
                      debts:
                        total_due_usd: 51.75
                        players: 2
                        total_due_syp: 672750
                      cash_sessions:
                      - branch:
                          id: 1
                          name: الفرع الرئيسي - المزة
                        is_open: false
                        session_id: null
                        opened_at: null
                        balance: null
                      - branch:
                          id: 2
                          name: فرع المالكي
                        is_open: false
                        session_id: null
                        opened_at: null
                        balance: null
                      finance:
                        revenue_today_usd: 215.12
                        revenue_month_usd: 215.12
                        expenses_month_usd: 276.54
                        net_month_usd: -61.42
                        revenue_last_14_days:
                        - date: '2026-10-28'
                          revenue_usd: 0
                        - date: '2026-10-29'
                          revenue_usd: 0
                        - date: '2026-10-30'
                          revenue_usd: 0
                        - date: '2026-10-31'
                          revenue_usd: 0
                        - date: '2026-11-01'
                          revenue_usd: 0
                        - date: '2026-11-02'
                          revenue_usd: 0
                        - date: '2026-11-03'
                          revenue_usd: 0
                        - date: '2026-11-04'
                          revenue_usd: 0
                        - date: '2026-11-05'
                          revenue_usd: 0
                        - date: '2026-11-06'
                          revenue_usd: 0
                        - date: '2026-11-07'
                          revenue_usd: 0
                        - date: '2026-11-08'
                          revenue_usd: 0
                        - date: '2026-11-09'
                          revenue_usd: 0
                        - date: '2026-11-10'
                          revenue_usd: 215.12
                      alerts:
                      - type: cash_session_closed
                        message: يوجد فرع صندوقه مغلق
                case2:
                  summary: لوحة الاستقبال (بلا مالية)
                  value:
                    success: true
                    message: لوحة النادي
                    data:
                      business_date: '2026-11-10'
                      exchange_rate: 13000
                      players:
                        total: 4
                        new_this_month: 4
                      memberships:
                        active: 3
                        frozen: 0
                        expiring_7_days: 0
                        in_grace: 0
                        sold_today: 5
                        sold_this_month: 5
                      attendance:
                        today: 5
                        rejected_today: 1
                        this_month: 5
                        visitors_today: 2
                      day_passes:
                        today: 3
                        this_month: 3
                      debts:
                        total_due_usd: 51.75
                        players: 2
                        total_due_syp: 672750
                      cash_sessions:
                      - branch:
                          id: 1
                          name: الفرع الرئيسي - المزة
                        is_open: false
                        session_id: null
                        opened_at: null
                        balance: null
                      alerts:
                      - type: cash_session_closed
                        message: يوجد فرع صندوقه مغلق
        '401':
          description: لا توكن، أو توكن منتهٍ أو ملغى
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubErrorEnvelope'
              example:
                success: false
                message: غير مصرح لك بالوصول، يرجى تسجيل الدخول أولاً.
                code: UNAUTHENTICATED
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /archive:
    get:
      tags:
      - Club Admin - Club & Settings
      operationId: clubGetArchive
      summary: أعداد الأرشيف بكل قسم
      description: '**الصلاحية:** المالك فقط.'
      responses:
        '200':
          description: الأرشيف
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ClubSuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        players:
                          type: integer
                        receptionists:
                          type: integer
                        staff_members:
                          type: integer
                        membership_plans:
                          type: integer
                        branches:
                          type: integer
              example:
                success: true
                message: محتويات الأرشيف
                data:
                  players: 0
                  receptionists: 0
                  staff_members: 0
                  membership_plans: 0
                  branches: 0
        '401':
          description: لا توكن، أو توكن منتهٍ أو ملغى
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubErrorEnvelope'
              example:
                success: false
                message: غير مصرح لك بالوصول، يرجى تسجيل الدخول أولاً.
                code: UNAUTHENTICATED
        '403':
          description: لا صلاحية (دور أو فرع أو ميزة الخطة أو حالة)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClubErrorEnvelope'
              example:
                success: false
                message: ليس لديك الصلاحية لتنفيذ هذا الإجراء.
                code: FORBIDDEN
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /club:
    get:
      tags:
      - Club Admin - Club & Settings
      operationId: clubGetClub
      summary: بيانات النادي وإعداداته واستهلاك الخطة
      description: '**الصلاحية:** المالك وموظف الاستقبال (بفروعه).'
      responses:
        '200':
          description: بيانات النادي
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ClubSuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                        slug:
                          type: string
                        logo_url:
                          type: string
                          nullable: true
                        contact_email:
                          type: string
                          nullable: true
                        contact_phone:
                          type: string
                        country:
                          type: string
                        city:
                          type: string
                        address:
                          type: string
                          nullable: true
                        settings:
                          type: object
                          properties:
                            timezone:
                              type: string
                            week_start_day:
                              type: string
                            weekend_days:
                              type: array
                              items:
                                type: string
                            business_day_ends_at_hour:
                              type: integer
                            membership_grace_days:
                              type: integer
                            default_max_freezes:
                              type: integer
                            default_max_freeze_days:
                              type: integer
                            duplicate_check_in_minutes:
                              type: integer
                            allow_partial_payment:
                              type: boolean
                            receipt_footer:
                              type: string
                              nullable: true
                            expiry_reminders_enabled:
                              type: boolean
                            disabled_notifications:
                              type: array
                              items:
                                type: object
                            day_pass_enabled:
                              type: boolean
                            day_pass_price_usd:
                              type: number
                              nullable: true
                            player_workouts_enabled:
                              type: boolean
                        exchange_rate:
                          type: number
                          nullable: true
                        subscription:
                          type: object
                          properties:
                            status:
                              type: string
                            is_trial:
                              type: boolean
                            plan:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                            starts_at:
                              type: string
                              format: date
                            ends_at:
                              type: string
                              format: date
                            days_remaining:
                              type: integer
                        usage:
                          type: object
                          properties:
                            players:
                              type: object
                              properties:
                                used:
                                  type: integer
                                limit:
                                  type: integer
                            staff:
                              type: object
                              properties:
                                used:
                                  type: integer
                                limit:
                                  type: integer
                            branches:
                              type: object
                              properties:
                                used:
                                  type: integer
                                limit:
                                  type: integer
                        features:
                          type: object
                          properties:
                            player_app:
                              type: boolean
                            qr_attendance:
                              type: boolean
                            offline_reception:
                              type: boolean
                            advanced_finance:
                              type: boolean
                            advanced_reports:
                              type: boolean
                            reports_export:
                              type: boolean
                            custom_branding:
                              type: boolean
                            priority_support:
                              type: boolean
              example:
                success: true
                message: بيانات النادي
                data:
                  id: 1
                  name: نادي القمة الرياضي
                  slug: qimma
                  logo_url: null
                  contact_email: null
                  contact_phone: '+963112223344'
                  country: SY
                  city: دمشق
                  address: null
                  settings:
                    timezone: Asia/Damascus
                    week_start_day: saturday
                    weekend_days:
                    - friday
                    business_day_ends_at_hour: 2
                    membership_grace_days: 3
                    default_max_freezes: 2
                    default_max_freeze_days: 30
                    duplicate_check_in_minutes: 120
                    allow_partial_payment: true
                    receipt_footer: null
                    expiry_reminders_enabled: true
                    disabled_notifications: []
                    day_pass_enabled: true
                    day_pass_price_usd: null
                    player_workouts_enabled: true
                  exchange_rate: null
                  subscription:
                    status: active
                    is_trial: false
