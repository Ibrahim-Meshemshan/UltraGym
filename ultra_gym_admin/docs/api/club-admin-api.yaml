    get:
      tags:
      - Club Admin - Reception Offline
      operationId: clubGetReceptionOfflinePack
      summary: حزمة العمل أوفلاين
      description: '**الصلاحية:** المالك وموظف الاستقبال (بفروعه).


        حزمة العمل دون إنترنت **مقسّمة بمؤشر** (نادٍ بعشرات آلاف اللاعبين لا يُحمَّل بطلب واحد):


        1. **التحميل الكامل:** بلا `cursor` ولا `updated_since`، ثم كرر بـ `cursor = meta.cursor.next_cursor` حتى `has_more = false`. الصفحة الأولى فقط فيها `branch` و`settings` و`plans`
        و`exchange_rate` و`qr`.

        2. **التحديث التزايدي:** `updated_since = generated_at` من بداية آخر تحميل، فيرجع فقط اللاعبون الذين تغيّر حسابهم أو عضويتهم أو ملفهم أو معرّفهم أو اشتراكاتهم أو مفتاح QR، ومعهم
        المحذوف (`is_removed`، `is_revoked`، الاشتراكات الملغاة) ليُزال من الجهاز.


        يتحقق الجهاز من الدخول ورموز QR (Ed25519) محلياً بنفس قواعد السيرفر.'
      parameters:
      - name: device_uuid
        in: query
        required: true
        schema:
