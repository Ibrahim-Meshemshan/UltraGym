      operationId: clubGetReportsReport
      summary: توليد تقرير (JSON أو PDF أو Excel)
      description: '**الصلاحية:** المالك وموظف الاستقبال (بفروعه).


        `report`: `financial_summary` (الأرباح والخسائر)، `daily_cash`، `memberships`، `attendance`، `debts`، `expiring`، `trainers`، `branches` (تتطلب advanced_reports).


        - التقارير المالية (`financial_summary` `daily_cash` `trainers` `branches`) للمالك فقط.

        - `format=pdf` أو `xlsx` يتطلب ميزة `reports_export`. الشكل نفسه: `summary` (بطاقات) و`sections` (جداول) و`data` (أرقام خام للرسوم).'
      parameters:
      - name: report
        in: path
        required: true
        schema:
          type: string
          enum:
          - financial_summary
          - daily_cash
          - memberships
          - attendance
          - debts
          - expiring
          - trainers
          - branches
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
      - name: branch_id
        in: query
        required: false
        schema:
          type: integer
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - json
          - pdf
          - xlsx
      - name: page
        in: query
        required: false
        schema:
          type: integer
        description: لقوائم debts و expiring (data.pagination)
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
        description: 1-200، افتراضياً 50
      responses:
        '200':
          description: الملف (Excel)
          headers:
            Content-Disposition:
              schema:
                type: string
              example: attachment; filename=memberships-2026-11-01-2026-11-10.xlsx
