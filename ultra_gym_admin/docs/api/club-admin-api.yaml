  /memberships:
    post:
      tags:
      - Club Admin - Memberships & Debts
      operationId: clubPostMemberships
      summary: بيع اشتراك مع الدفعات
      description: '**الصلاحية:** المالك وموظف الاستقبال (بفروعه).


        - `payments`: دفعة أو أكثر بعملات مختلفة (`USD` / `SYP`). الليرة تُحوَّل بسعر الصرف الحالي، وكل دفعة حركة بإيصال.

        - مجموع الدفعات أقل من الصافي = **الباقي دين** (إن كان `allow_partial_payment` مفعّلاً بالإعدادات)، وأكبر منه `422`.

        - يتطلب **وردية صندوق مفتوحة** بالفرع (`409 CASH_SESSION_REQUIRED`)، و**سعر صرف** لأي دفعة بالليرة (`409 EXCHANGE_RATE_MISSING`).

        - `coupon_code` للجميع، و`discount_usd` (خصم يدوي) **للمالك فقط** (`403`).

        - خطة تدريب خاص تتطلب `trainer_id`، وتُحسب عمولة المدرب وقت البيع (`trainer_commission_usd`).

        - `client_uuid` اختياري: إعادة نفس الطلب ترجع الاشتراك الموجود دون تكرار.

        - `branch_id`: فرع البيع والصندوق. يُستنتج تلقائياً إن كان للمستخدم فرع واحد.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                player_id:
                  type: integer
                plan_id:
                  type: integer
                coupon_code:
                  type: string
                payments:
                  type: array
                  items:
                    type: object
                    properties:
                      currency:
                        type: string
                      amount:
                        type: number
                client_uuid:
                  type: string
                branch_id:
                  type: integer
                trainer_id:
                  type: integer
                discount_usd:
                  type: number
                notes:
                  type: string
              required:
              - plan_id
              - player_id
            examples:
              ex1:
                summary: بيع بدفعة جزئية بالعملتين
                value:
                  player_id: 4
                  plan_id: 1
                  coupon_code: RAMADAN10
                  payments:
                  - currency: USD
                    amount: 10
                  - currency: SYP
                    amount: 104000
                  client_uuid: 04890301-fc01-4ffb-8bae-2e6d332ed759
              ex2:
                summary: تدريب خاص مدفوع كاملاً
                value:
                  player_id: 5
                  plan_id: 3
                  branch_id: 1
                  trainer_id: 1
                  discount_usd: 10
                  payments:
                  - currency: USD
                    amount: 90
                  notes: خصم للطلاب
              ex3:
                summary: جلسات
                value:
                  player_id: 6
                  plan_id: 2
                  payments:
                  - currency: SYP
                    amount: 390000
      responses:
        '201':
          description: تم الإنشاء
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ClubSuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        membership:
                          type: object
                          properties:
                            id:
                              type: integer
                            player:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                            plan:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                            type:
                              type: string
                            branch:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                            branch_scope:
                              type: string
                            branch_ids:
                              type: array
                              items:
                                type: integer
                            starts_on:
                              type: string
                              format: date
                            ends_on:
                              type: string
                              format: date
                            days_remaining:
                              type: integer
                            sessions_total:
                              type: number
