                          type: string
                        cancelled_at:
                          type: string
                          nullable: true
                        cancellation_reason:
                          type: string
                          nullable: true
                        attendance_record_id:
                          type: string
                          nullable: true
                        is_offline:
                          type: boolean
                        notes:
                          type: string
                          nullable: true
