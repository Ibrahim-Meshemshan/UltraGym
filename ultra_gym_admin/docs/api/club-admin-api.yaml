components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      description: توكن من POST /api/v1/auth/login
  schemas:
    ClubSuccessEnvelope:
      type: object
      required:
      - success
      - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          type: object
          nullable: true
        meta:
          type: object
          nullable: true
          properties:
            pagination:
              $ref: '#/components/schemas/ClubPagination'
    ClubErrorEnvelope:
      type: object
      required:
      - success
      - message
      - code
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        code:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          nullable: true
        data:
          type: object
          nullable: true
    ClubPagination:
      type: object
      properties:
        current_page:
          type: integer
          nullable: false
        per_page:
          type: integer
          nullable: false
        total:
          type: integer
          nullable: false
        last_page:
          type: integer
          nullable: false
        from:
          type: integer
          nullable: true
        to:
          type: integer
          nullable: true
  responses:
    Unauthenticated:
      description: لا توكن أو توكن غير صالح
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClubErrorEnvelope'
          example:
            success: false
            message: غير مصرح لك بالوصول، يرجى تسجيل الدخول أولاً.
            code: UNAUTHENTICATED
    TooManyRequests:
      description: تجاوز حد الطلبات
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClubErrorEnvelope'
          example:
            success: false
            message: عدد الطلبات كبير، حاول بعد قليل
            code: TOO_MANY_REQUESTS
    ServerError:
      description: خطأ غير متوقع (التفاصيل بسجل الخادم)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ClubErrorEnvelope'
          example:
            success: false
            message: حدث خطأ غير متوقع، يرجى المحاولة لاحقاً.
            code: SERVER_ERROR
