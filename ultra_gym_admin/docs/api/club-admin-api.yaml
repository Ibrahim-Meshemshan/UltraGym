  /day-passes:
    post:
      tags:
      - Club Admin - Day Passes
      operationId: clubPostDayPasses
      summary: بيع دخول يومي (زائر أو لاعب)
      description: '**الصلاحية:** المالك وموظف الاستقبال (بفروعه).


        زيارة مدفوعة ليوم عمل واحد بالفرع:

        - **زائر:** `visitor_name` (و`visitor_phone` اختياري) بلا حساب ولا يُحسب على حد اللاعبين.

        - **لاعب مسجّل بلا اشتراك:** `player_id` أو `member_code`. يُسجَّل له دخول مقبول (`method = day_pass`) ويقدر يدخل مجدداً بنفس اليوم بنفس الفرع. لاعب عنده اشتراك صالح بالفرع:
        `409 HAS_ACTIVE_MEMBERSHIP`، ودخول ثانٍ بنفس اليوم: `409 DAY_PASS_EXISTS`.

        - **السعر:** سعر الفرع (`branches.day_pass_price_usd`) وإلا سعر النادي (`club/settings.day_pass_price_usd`)، وبلا سعر `422 DAY_PASS_PRICE_MISSING`. `price_usd` لتغييره **للمالك
        فقط** (`403`)، و`0` = يوم تجربة مجاني.

        - **الدفع كامل** (لا دين على زائر) بعملة أو أكثر، وكل دفعة حركة `day_pass` بإيصال وتتطلب وردية مفتوحة.

        - **أوقات الذكور والإناث** تنطبق: بفرع `time_split` جنس الزائر `gender` مطلوب (`409 GENDER_UNKNOWN` / `GENDER_HOURS`).

        - `day_pass_enabled = false` بالإعدادات: `409 DAY_PASS_DISABLED`. و`client_uuid` يمنع التكرار.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                visitor_name:
                  type: string
                visitor_phone:
                  type: string
                payments:
                  type: array
                  items:
                    type: object
                    properties:
                      currency:
                        type: string
                      amount:
                        type: number
                client_uuid:
                  type: string
                player_id:
                  type: integer
                price_usd:
                  type: number
              required:
              - visitor_name
            examples:
              ex1:
                summary: زائر
                value:
                  visitor_name: خالد الأحمد
                  visitor_phone: 0933556677
                  payments:
                  - currency: USD
                    amount: 5
                  client_uuid: 8d6185d4-6e35-4aeb-8a82-ec65b1e4511d
              ex2:
                summary: لاعب بلا اشتراك (يُسجَّل دخوله)
                value:
                  player_id: 7
                  payments:
                  - currency: USD
                    amount: 5
              ex3:
                summary: يوم تجربة مجاني (المالك)
                value:
                  visitor_name: مروان (يوم تجربة)
                  price_usd: 0
      responses:
        '201':
          description: تم الإنشاء
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/ClubSuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        id:
                          type: integer
