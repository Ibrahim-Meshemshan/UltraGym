            schema:
              type: object
              properties:
                membership_grace_days:
                  type: integer
                duplicate_check_in_minutes:
                  type: integer
                business_day_ends_at_hour:
                  type: integer
                receipt_footer:
                  type: string
                disabled_notifications:
                  type: array
                  items:
