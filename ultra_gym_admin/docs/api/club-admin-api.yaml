              example:
                success: false
                message: غير مصرح لك بالوصول، يرجى تسجيل الدخول أولاً.
                code: UNAUTHENTICATED
        '403':
          description: لا صلاحية (دور أو فرع أو ميزة الخطة أو حالة)
