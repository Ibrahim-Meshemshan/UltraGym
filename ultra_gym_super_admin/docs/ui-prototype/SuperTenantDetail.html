<meta charset="utf-8">

<title>لوحة المنصة · تفاصيل النادي · UltraGym v1</title>
<style>
@font-face{font-family:'Changa';src:url(assets/Changa-VariableFont_wght.ttf) format('truetype');font-weight:200 800;font-display:swap}
@font-face{font-family:'Readex Pro';src:url(assets/ReadexPro-VariableFont_wght.ttf) format('truetype');font-weight:160 700;font-display:swap}
body{margin:0;background:var(--bg)}
a{color:var(--p-ink);text-decoration:none}a:hover{color:var(--p-ink2)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.cut{background:var(--line);padding:1px;border-radius:16px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.cut>.in{background:var(--surface);border-radius:15px;clip-path:polygon(0 0,calc(100% - 17.6px) 0,100% 17.6px,100% 100%,0 100%);height:100%;box-sizing:border-box}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.t-success{background:var(--s-soft);color:var(--s-ink)}.t-warning{background:var(--w-soft);color:var(--w-ink)}.t-danger{background:var(--d-soft);color:var(--d-ink)}.t-info{background:var(--i-soft);color:var(--i-ink)}.t-accent{background:var(--a-soft);color:var(--a-ink)}.t-primary{background:var(--p-soft);color:var(--p-ink)}.t-neutral{background:var(--soft);color:var(--muted)}
.btn{height:42px;padding:0 18px;border-radius:10px;font-family:'Readex Pro',sans-serif;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;cursor:pointer;box-sizing:border-box;white-space:nowrap}
.btn-primary{background:var(--primary);color:#1A1A18}.btn-secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}.btn-ghost{background:transparent;color:var(--p-ink);padding:0 8px;height:34px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.side{background:#1A1A17;color:#C9C9C0;flex:0 0 264px;width:264px;padding:20px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11.5px;color:#8A8A80;padding:12px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;border-radius:10px;color:#C9C9C0;font-size:13.5px;position:relative}
.nav:hover{background:rgba(255,255,255,.05);color:#F3F3EE}
.nav.on{background:rgba(255,255,255,.10);color:#F3F3EE;font-weight:600}
.nav.on::after{content:'';position:absolute;right:0;top:9px;bottom:9px;width:4px;border-radius:4px;background:#FF5A1F}
.nav.on svg{color:#FF5A1F}
.top{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-family:'Readex Pro',sans-serif;font-size:13px;color:var(--ink);cursor:pointer;box-sizing:border-box;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;position:relative}
.stage{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-family:'Readex Pro',sans-serif;cursor:pointer;text-align:right;min-width:112px;box-sizing:border-box}
.stage.on{border:2px solid var(--inv);padding:11px 15px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:1080px}
.tbl th{background:var(--soft);color:var(--muted);font-weight:500;font-size:12.5px;text-align:right;padding:10px 14px;white-space:nowrap}
.tbl td{padding:12px 14px;border-top:1px solid var(--divider);vertical-align:middle}
.tbl tbody tr:hover{background:var(--bg)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--inv);color:#FF6A30;display:flex;align-items:center;justify-content:center;font-family:'Changa',sans-serif;font-weight:700;font-size:15px;flex:0 0 auto}
.meter{height:6px;border-radius:999px;background:var(--soft);overflow:hidden;width:120px}
.pg{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:'Readex Pro',sans-serif;font-size:13px;color:var(--ink);cursor:pointer}
.pg.on{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
.ctabs{display:flex;gap:22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ctab{height:40px;padding:0 4px;font-size:14px;color:var(--muted);border:0;border-bottom:2px solid transparent;background:transparent;font-family:'Readex Pro',sans-serif;cursor:pointer}
.ctab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--primary)}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:8px 0;border-top:1px solid var(--divider)}
.kv>span:first-child{color:var(--muted)}
.h2{margin:0;font-size:16px;line-height:26px;font-weight:600}
.lim{display:flex;flex-direction:column;gap:6px}
.lim .meter{width:100%;height:8px}
.ev{display:flex;gap:14px;position:relative;padding-bottom:18px}
.ev::before{content:'';position:absolute;right:6px;top:16px;bottom:0;width:2px;background:var(--soft)}
.ev:last-child::before{display:none}
.dot{width:14px;height:14px;border-radius:50%;flex:0 0 14px;margin-top:3px;box-sizing:border-box;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.btn-danger{background:#D6335A;color:#FFFFFF}
.btn-dline{background:var(--surface);border-color:var(--d-line);color:var(--d-ink)}
.input{height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-family:'Readex Pro',sans-serif;font-size:14px;color:var(--ink);box-sizing:border-box;width:100%}
.dlg{background:var(--surface);border-radius:16px;box-shadow:0 24px 60px rgba(26,26,23,.16);width:100%;max-width:540px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.step{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.step b{width:22px;height:22px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px}
.step.on b{background:var(--inv);color:var(--on-inv)}.step.on{color:var(--ink);font-weight:600}

.th-light{--bg:#F5F5F2;--surface:#FFFFFF;--soft:#EDEDE8;--line:#E0E0DA;--divider:#EDEDE8;--inv:#1A1A17;--on-inv:#F3F3EE;--ink:#1A1A17;--muted:#5F5F57;--faint:#8A8A80;--primary:#FF5A1F;--p-soft:#FFE8DC;--p-ink:#B53D0A;--p-ink2:#8E2F06;--s-soft:#E3F5EC;--s-ink:#0D7350;--w-soft:#FFF1D1;--w-ink:#8A5800;--d-soft:#FDE6EC;--d-ink:#B81F45;--d-line:#F3C2CF;--i-soft:#E6ECFF;--i-ink:#2A50C8;--a-soft:#EEF8D2;--a-ink:#4F7A00}
.th-dark{--bg:#121210;--surface:#1B1B18;--soft:#24241F;--line:#2E2E29;--divider:#26261F;--inv:#F3F3EE;--on-inv:#1A1A17;--ink:#F3F3EE;--muted:#A9A99F;--faint:#7A7A70;--primary:#FF6A30;--p-soft:#3A1C10;--p-ink:#FF8E5E;--p-ink2:#FFB08A;--s-soft:#163126;--s-ink:#3DD68C;--w-soft:#33280F;--w-ink:#F5B642;--d-soft:#3A1520;--d-ink:#FF7A95;--d-line:#5A2333;--i-soft:#1C2747;--i-ink:#8AA9FF;--a-soft:#263012;--a-ink:#C8F03C}
.th-dark{color-scheme:dark}
.th-dark .tbl tbody tr:hover{background:#24241F}

.sk{background:linear-gradient(90deg,var(--soft,#24241F) 25%,var(--line,#2E2E29) 37%,var(--soft,#24241F) 63%);background-size:400% 100%;animation:skm 1.4s ease infinite;border-radius:8px}
@keyframes skm{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.pse{background:var(--surface,#1B1B18);border:1px solid var(--line,#2E2E29);border-radius:16px;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.pse .ico{width:56px;height:56px;border-radius:999px;background:var(--d-soft,#3A1520);color:var(--d-ink,#FF7A95);display:flex;align-items:center;justify-content:center}
</style>
