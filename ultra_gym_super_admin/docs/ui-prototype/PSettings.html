<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة المنصة · الإعدادات · UltraGym v1</title>
<style>
@font-face{font-family:'Changa';src:url(assets/Changa-VariableFont_wght.ttf) format('truetype');font-weight:200 800;font-display:swap}
@font-face{font-family:'Readex Pro';src:url(assets/ReadexPro-VariableFont_wght.ttf) format('truetype');font-weight:160 700;font-display:swap}
body{margin:0;background:var(--bg)}
a{color:var(--p-ink);text-decoration:none}a:hover{color:var(--p-ink2)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.cut{background:var(--line);padding:1px;border-radius:16px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.cut>.in{background:var(--surface);border-radius:15px;clip-path:polygon(0 0,calc(100% - 17.6px) 0,100% 17.6px,100% 100%,0 100%);height:100%;box-sizing:border-box}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.t-success{background:var(--s-soft);color:var(--s-ink)}.t-warning{background:var(--w-soft);color:var(--w-ink)}.t-danger{background:var(--d-soft);color:var(--d-ink)}.t-info{background:var(--i-soft);color:var(--i-ink)}.t-accent{background:var(--a-soft);color:var(--a-ink)}.t-primary{background:var(--p-soft);color:var(--p-ink)}.t-neutral{background:var(--soft);color:var(--muted)}
.btn{height:42px;padding:0 18px;border-radius:10px;font-family:'Readex Pro',sans-serif;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;cursor:pointer;box-sizing:border-box;white-space:nowrap}
.btn-primary{background:var(--primary);color:#1A1A18}.btn-secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}.btn-ghost{background:transparent;color:var(--p-ink);padding:0 8px;height:34px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.side{background:#1A1A17;color:#C9C9C0;flex:0 0 264px;width:264px;padding:20px 12px;box-sizing:border-box;display:flex;flex-direction:column;gap:2px}
.nav-label{font-size:11.5px;color:#8A8A80;padding:12px 12px 6px}
.nav{display:flex;align-items:center;gap:12px;height:38px;padding:0 12px;border-radius:10px;color:#C9C9C0;font-size:13.5px;position:relative}
.nav:hover{background:rgba(255,255,255,.05);color:#F3F3EE}
.nav.on{background:rgba(255,255,255,.10);color:#F3F3EE;font-weight:600}
.nav.on::after{content:'';position:absolute;right:0;top:9px;bottom:9px;width:4px;border-radius:4px;background:#FF5A1F}
.nav.on svg{color:#FF5A1F}
.top{height:64px;display:flex;align-items:center;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-family:'Readex Pro',sans-serif;font-size:13px;color:var(--ink);cursor:pointer;box-sizing:border-box;white-space:nowrap}
.iconbtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;position:relative}
.stage{display:flex;flex-direction:column;gap:2px;padding:12px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-family:'Readex Pro',sans-serif;cursor:pointer;text-align:right;min-width:112px;box-sizing:border-box}
.stage.on{border:2px solid var(--inv);padding:11px 15px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;min-width:1080px}
.tbl th{background:var(--soft);color:var(--muted);font-weight:500;font-size:12.5px;text-align:right;padding:10px 14px;white-space:nowrap}
.tbl td{padding:12px 14px;border-top:1px solid var(--divider);vertical-align:middle}
.tbl tbody tr:hover{background:var(--bg)}
.logo{width:36px;height:36px;border-radius:10px;background:var(--inv);color:#FF6A30;display:flex;align-items:center;justify-content:center;font-family:'Changa',sans-serif;font-weight:700;font-size:15px;flex:0 0 auto}
.meter{height:6px;border-radius:999px;background:var(--soft);overflow:hidden;width:120px}
.pg{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-family:'Readex Pro',sans-serif;font-size:13px;color:var(--ink);cursor:pointer}
.pg.on{background:var(--inv);color:var(--on-inv);border-color:var(--inv)}
.ctab{border:0;background:transparent;font-family:'Readex Pro',sans-serif;cursor:pointer}
.sel{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-family:'Readex Pro',sans-serif;font-size:14px;color:var(--ink);box-sizing:border-box;width:100%}
.fi{display:flex;flex-direction:column;gap:6px;min-width:0}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{height:36px;padding:0 16px;border-radius:8px;border:0;background:transparent;font-family:'Readex Pro',sans-serif;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(26,26,23,.08)}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-family:'Readex Pro',sans-serif;font-size:12.5px;color:var(--muted);cursor:pointer}
.chip.on{background:var(--inv);border-color:var(--inv);color:var(--on-inv)}
.sw{width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;display:inline-block;flex:0 0 40px}
.sw::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#FFFFFE}
.sw.on{background:var(--primary)}.sw.on::after{right:auto;left:3px}
.stat{flex:1 1 180px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat span{font-size:12.5px;color:var(--muted)}
.stat strong{font-family:'Changa',sans-serif;font-size:24px;font-weight:700}
.av{width:36px;height:36px;border-radius:999px;background:var(--soft);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:0 0 36px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:9px 0;border-top:1px solid var(--divider)}
.kv>span:first-child{color:var(--muted)}
.h2{margin:0;font-size:16px;line-height:26px;font-weight:600}
.btn-danger{background:#D6335A;color:#FFFFFF}
.btn-dline{background:var(--surface);border-color:var(--d-line);color:var(--d-ink)}
.ov{position:absolute;inset:0;background:rgba(26,26,23,.5);display:flex;align-items:flex-start;justify-content:center;padding:96px 16px;box-sizing:border-box}
.dlg{max-width:600px;padding:24px;display:flex;flex-direction:column;gap:16px}
.dh{display:flex;justify-content:space-between;align-items:center}
.dh h2{margin:0;font-size:19px;line-height:30px;font-weight:600}

.input{height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-family:'Readex Pro',sans-serif;font-size:16px;color:var(--ink);box-sizing:border-box;width:100%}
.lbl{font-size:12.5px;font-weight:500;color:var(--muted)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ctabs{display:flex;gap:22px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.ctab{height:40px;padding:0 4px;font-size:14px;color:var(--muted);border-bottom:2px solid transparent;display:flex;align-items:center}
.ctab.on{color:var(--ink);font-weight:600;border-bottom-color:var(--primary)}
.dlg{background:var(--surface);border-radius:16px;box-shadow:0 24px 60px rgba(26,26,23,.16);width:100%;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}

.th-light{--bg:#F5F5F2;--surface:#FFFFFF;--soft:#EDEDE8;--line:#E0E0DA;--divider:#EDEDE8;--inv:#1A1A17;--on-inv:#F3F3EE;--ink:#1A1A17;--muted:#5F5F57;--faint:#8A8A80;--primary:#FF5A1F;--p-soft:#FFE8DC;--p-ink:#B53D0A;--p-ink2:#8E2F06;--s-soft:#E3F5EC;--s-ink:#0D7350;--w-soft:#FFF1D1;--w-ink:#8A5800;--d-soft:#FDE6EC;--d-ink:#B81F45;--d-line:#F3C2CF;--i-soft:#E6ECFF;--i-ink:#2A50C8;--a-soft:#EEF8D2;--a-ink:#4F7A00}
.th-dark{--bg:#121210;--surface:#1B1B18;--soft:#24241F;--line:#2E2E29;--divider:#26261F;--inv:#F3F3EE;--on-inv:#1A1A17;--ink:#F3F3EE;--muted:#A9A99F;--faint:#7A7A70;--primary:#FF6A30;--p-soft:#3A1C10;--p-ink:#FF8E5E;--p-ink2:#FFB08A;--s-soft:#163126;--s-ink:#3DD68C;--w-soft:#33280F;--w-ink:#F5B642;--d-soft:#3A1520;--d-ink:#FF7A95;--d-line:#5A2333;--i-soft:#1C2747;--i-ink:#8AA9FF;--a-soft:#263012;--a-ink:#C8F03C}
.th-dark{color-scheme:dark}
.th-dark .tbl tbody tr:hover{background:#24241F}

.sk{background:linear-gradient(90deg,var(--soft,#24241F) 25%,var(--line,#2E2E29) 37%,var(--soft,#24241F) 63%);background-size:400% 100%;animation:skm 1.4s ease infinite;border-radius:8px}
@keyframes skm{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.pse{background:var(--surface,#1B1B18);border:1px solid var(--line,#2E2E29);border-radius:16px;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.pse .ico{width:56px;height:56px;border-radius:999px;background:var(--d-soft,#3A1520);color:var(--d-ink,#FF7A95);display:flex;align-items:center;justify-content:center}
</style>
<link rel="stylesheet" href="proto.css">
</head>
<body>
<div id="dc-root"></div>
<template id="dc-src">
<div class="{{ themeCls }}" style="min-height:1000px;display:flex;flex-wrap:wrap;font-family:'Readex Pro',sans-serif;color:var(--ink);direction:rtl;background:var(--bg);position:relative">

    <a class="nav" href="POverview.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="8" height="10" rx="2"/><rect x="13" y="3" width="8" height="6" rx="2"/><rect x="13" y="11" width="8" height="10" rx="2"/><rect x="3" y="15" width="8" height="6" rx="2"/></svg>نظرة عامة</a>

    <a class="nav" href="SuperTenants.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21V9l9-6 9 6v12M9 21v-6h6v6"/></svg>النوادي</a>
    <a class="nav" href="PSubscriptions.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-5L4 8M4 4v4h4M4 13a8 8 0 0 0 14 5l2-2M20 20v-4h-4"/></svg>الاشتراكات</a>
    <a class="nav" href="PInvoices.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2zM9 8h6M9 12h6"/></svg>الفواتير والدفعات</a>
    <a class="nav" href="PPlans.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.5"/></svg>الباقات</a>
    <a class="nav" href="PUsers.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7"/></svg>مستخدمو النوادي</a>
    <span class="nav-label">التواصل</span>
    <a class="nav" href="PSupport.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg>الدعم الفني<span style="margin-right:auto;min-width:20px;height:20px;border-radius:999px;background:#C8F03C;color:#1A1A17;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center">7</span></a>
    <a class="nav" href="PAnnouncements.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10v4h3l7 4V6L6 10zM17 9a4 4 0 0 1 0 6"/></svg>الإعلانات</a>
    <a class="nav" href="PTemplates.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v14H4zM4 9h16"/></svg>قوالب الرسائل</a>
    <span class="nav-label">المنصة</span>
    <a class="nav" href="PAnalytics.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>التحليلات</a>
    <a class="nav" href="PAppVersions.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3h10v18H7zM11 18h2"/></svg>نسخ التطبيقات</a>
    <a class="nav" href="PAudit.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6l1 3h4v13H4V7h4z"/><path d="M9 13l2 2 4-4"/></svg>سجل التدقيق</a>
    <a class="nav" href="PSystem.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><ellipse cx="12" cy="6" rx="8" ry="3"/><path d="M4 6v12c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>النظام والنسخ</a>
    <a class="nav" href="PTeam.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/></svg>فريق المنصة</a>
    <a class="nav on" href="PSettings.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>الإعدادات</a>
    <div style="margin-top:auto;padding:16px 12px 0;border-top:1px solid #2E2E29;display:flex;align-items:center;gap:10px">
      <span style="width:36px;height:36px;border-radius:999px;background:#C8F03C;color:#1A1A17;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px">م</span>
      <span style="display:flex;flex-direction:column"><strong style="color:#F3F3EE;font-size:13px;font-weight:600">مجد الأيوبي</strong><span style="font-size:11.5px;color:#A9A99F">مالك المنصة</span></span>
    </div>
  </nav>

  <div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
    <header class="top">
      <h1 style="margin:0;font-size:24px;line-height:36px;font-weight:600;margin-left:auto">إعدادات المنصة</h1>
      <button class="pill" type="button" style="width:320px;justify-content:flex-start;color:var(--muted)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>بحث شامل: نوادٍ، مستخدمون، فواتير</button>
      <button class="iconbtn" type="button" onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" title="{{ themeLabel }}"><template data-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></template><template data-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></template></button>
      <button class="iconbtn" type="button" aria-label="الإشعارات، 3 غير مقروءة"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg><span style="position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;border-radius:999px;background:#C8F03C;color:#1A1A18;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center">3</span></button>
    </header>

    <main style="padding:24px;display:flex;flex-direction:column;gap:16px;max-width:1320px;width:100%;box-sizing:border-box">
<template data-if value="{{ psReady }}" hint-placeholder-val="{{ true }}"><div style="display:contents">
      <section class="cut"><div class="in" style="padding:22px 24px;display:flex;flex-direction:column;gap:16px">
        <h2 class="h2">الأمان والجلسات</h2>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">
          <template data-for list="{{ sec }}" as="s" hint-placeholder-count="5"><div class="fi"><label class="lbl">{{ s.l }}</label><input class="sel" dir="ltr" style="text-align:right" value="{{ s.v }}" aria-label="{{ s.l }}"><span style="font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px"><span>{{ s.h }}</span><code class="ltr" style="font-size:11px;color:var(--faint)">{{ s.k }}</code></span></div></template>
        </div>
      </div></section>
      <section class="cut"><div class="in" style="padding:22px 24px;display:flex;flex-direction:column;gap:16px">
        <h2 class="h2">الاشتراكات والفواتير</h2>
        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px">
          <div class="fi"><label class="lbl" for="ps-t">أيام التجربة الافتراضية</label><input id="ps-t" class="sel" dir="ltr" style="text-align:right" value="14"></div>
          <div class="fi"><label class="lbl" for="ps-g">أيام السماح</label><input id="ps-g" class="sel" dir="ltr" style="text-align:right" value="3"></div>
          <div class="fi"><label class="lbl" for="ps-r">أيام القراءة فقط قبل القفل</label><input id="ps-r" class="sel" dir="ltr" style="text-align:right" value="3"></div>
          <div class="fi"><label class="lbl" for="ps-d">استحقاق الفاتورة بالأيام</label><input id="ps-d" class="sel" dir="ltr" style="text-align:right" value="14"></div>
        </div>
        <p style="margin:0;font-size:12.5px;color:var(--w-ink)">القيم من التوثيق؛ أسماء مفاتيح هذه المجموعة غير مذكورة فيه.</p>
      </div></section>
