                    revenue_usd: 4100.0
        '401': &id001
          $ref: '#/components/responses/Unauthenticated'
        '403': &id002
          $ref: '#/components/responses/Forbidden'
        '429': &id003
          $ref: '#/components/responses/TooManyRequests'
        '500': &id004
          $ref: '#/components/responses/ServerError'
  /users/reset-passwords:
    post:
      tags:
      - Super Admin - Users
      operationId: usersResetPasswordsBulk
      summary: إعادة تعيين كلمات السر لعدة حسابات دفعة واحدة
      description: يحدد الحسابات بـ `user_ids`، أو بحالة التفعيل `activation_state` (لم يدخل بعد / كلمة منتهية) مع `tenant_id` و `role` اختياريين. لكل حساب كلمة مؤقتة جديدة (رقمية للاعبين والموظفين، أحرف
        وأرقام لمالك النادي) وتنتهي جلساته. الكلمات تظهر بهذا الرد مرة واحدة، والواجهة تطبع منها بطاقات الدخول (`users/cards/pdf`). حد أقصى 300 حساب بالطلب.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_ids:
                  type: array
                  items:
                    type: integer
                  maxItems: 300
                  description: مطلوب إن غاب activation_state
                activation_state:
                  type: string
                  enum:
                  - never_logged_in
                  - expired
                  description: مطلوب إن غاب user_ids
                tenant_id:
                  type: integer
                  nullable: true
                role:
                  type: string
                  enum:
                  - club_owner
                  - receptionist
                  - player
                  nullable: true
                valid_days:
                  type: integer
                  minimum: 1
                  maximum: 30
                  nullable: true
                  description: مدة صلاحية الكلمة المؤقتة (الافتراضي من security.temporary_password_days)
            example:
              activation_state: never_logged_in
              tenant_id: 12
              role: player
              valid_days: 7
      responses:
        '200':
          description: تمت إعادة تعيين كلمة السر لـ 1 حساب
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        credentials:
                          type: array
                          items:
                            type: object
                        skipped:
                          type: array
                          items:
                            type: object
              example:
                success: true
                message: تمت إعادة تعيين كلمة السر لـ 1 حساب
                data:
                  credentials:
                  - user_id: 41
                    name: سامر الحلبي
                    role_label: موظف استقبال
                    tenant_name: نادي القمة الرياضي
                    member_code: QMA-482913
                    phone: '+963933000041'
                    temporary_password: <generated-once>
                    expires_at: '2026-11-09T10:00:00Z'
                    temporary_password_expires_at: '2026-11-09T10:00:00Z'
                    whatsapp_message: 'تمت إعادة تعيين كلمة السر لحسابك في نادي القمة الرياضي - الرقم: +963933000041 - كلمة السر المؤقتة: <generated-once> - سيُطلب منك تغييرها عند أول دخول. - معرّف الدخول:
                      QMA-482913 (يصلح بدل رقم الموبايل).'
                  skipped: []
        '422':
          $ref: '#/components/responses/ValidationError'
        '401': *id001
        '403': *id002
        '429': *id003
        '500': *id004
  /users/cards/pdf:
    post:
      tags:
      - Super Admin - Users
      operationId: usersLoginCardsPdf
      summary: طباعة بطاقات الدخول (PDF)
      description: 'ورقة بطاقات تُقص وتُسلَّم لكل عضو: المعرّف، الرقم، وكلمة السر المؤقتة. كلمات السر لا تُخزَّن بنصها، فالواجهة ترسل البطاقات من رد إعادة التعيين مباشرة. حد أقصى 300 بطاقة.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - cards
              properties:
                cards:
                  type: array
                  minItems: 1
                  maxItems: 300
                  items:
                    type: object
                    required:
                    - name
                    - temporary_password
                    properties:
                      name:
                        type: string
                      role_label:
                        type: string
                      member_code:
                        type: string
                      phone:
                        type: string
                      temporary_password:
                        type: string
                      expires_at:
                        type: string
                      tenant_name:
                        type: string
            example:
              cards:
              - name: سامر الحلبي
                role_label: موظف استقبال
                member_code: QMA-482913
                phone: '+963933000041'
                temporary_password: <generated-once>
                expires_at: '2026-11-09T10:00:00Z'
                tenant_name: نادي القمة الرياضي
      responses:
        '200':
          description: ملف PDF (أو HTML قابل للطباعة إن لم يتوفر محرك PDF)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '422':
          $ref: '#/components/responses/ValidationError'
        '401': *id001
        '403': *id002
        '429': *id003
        '500': *id004
  /files/exports/{export_id}:
    get:
      tags:
      - Super Admin - System
