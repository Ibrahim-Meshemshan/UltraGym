openapi: 3.0.3
info:
  title: UltraGym - Super Admin API
  version: 1.0.0
  description: 'المرجع النهائي لواجهات لوحة السوبر أدمن (Flutter Web) لمنصة UltraGym لإدارة النوادي الرياضية. كل المسارات تحت `/api/v1/super-admin`.


    **شكل الرد (كل الحالات وكل أكواد HTTP):**

    - نجاح: `{ success: true, message, data, meta? }` - `meta.pagination` بالقوائم المقسّمة، و`meta.summary` حيث تلزم المجاميع.

    - خطأ: `{ success: false, message, code, errors? }` - `code` ثابت يعتمد عليه الفرونت (لا نص الرسالة)، و`errors` مع `422` فقط.

    - الرسائل عربية دائماً. أكواد الأخطاء: `UNAUTHENTICATED` 401، `INVALID_CREDENTIALS` 401، `FORBIDDEN` 403، `ACCOUNT_SUSPENDED` 403، `PASSWORD_CHANGE_REQUIRED` 403، `NOT_FOUND` 404، `METHOD_NOT_ALLOWED`
    405، `CONFLICT` 409، `VALIDATION_ERROR` 422 و413، `TOO_MANY_REQUESTS` 429، `SERVER_ERROR` 500، `MAINTENANCE` 503.


    **الصيغ:**

    - التواريخ ISO 8601 بتوقيت UTC. المبالغ بالدولار (`currency` = `USD`) بخانتين، بلا ضريبة. النسب من 0 إلى 100 بخانتين.

    - الموبايل بصيغة E.164 موحّدة (`+963911000001`) مهما كانت طريقة إدخاله.


    **الحسابات:**

    - فريق المنصة (`admins`) منفصل كلياً عن مستخدمي النوادي (`users`)، ولكل منهما توكن لا يصلح للآخر.

    - فريق المنصة: مالك واحد (`owner`) ومشرفون (`admin`) بنفس الصلاحيات. للمالك فقط: إدارة المشرفين، الحذف النهائي لنادٍ، قسم security بالإعدادات، وتحميل وحذف النسخ الاحتياطية. غيره `403`.

    - مستخدمو النوادي: حساب واحد لكل رقم موبايل، يرتبط بالنوادي عبر العضويات بأدوار: `club_owner` (مالك النادي)، `receptionist` (موظف استقبال)، `player` (لاعب).

    - **معرّف الدخول بالبادئة:** لكل نادٍ بادئة لاتينية من 2 إلى 4 أحرف (`code_prefix`)، ولكل عضو معرّف مثل `QMA-482913` بأرقام عشوائية. الدخول برقم الموبايل أو بالمعرّف، والمعرّف يحدد النادي مباشرة.

    - **تحكم كامل من السوبر:** إنشاء النوادي ومالكيها، إعادة تعيين كلمات السر (فردي وجماعي وبطاقات دخول مطبوعة)، الإيقاف والتفعيل، إنهاء الجلسات، تعديل البيانات، والدخول كمستخدم للدعم (impersonation: 30
    دقيقة، سبب إلزامي، كل طلب يُسجَّل، ولا تغيير لكلمات السر أو الأرقام خلاله).

    - كلمات السر تولَّد تلقائياً وتظهر بالرد مرة واحدة فقط، ويُجبر صاحبها على تغييرها بأول دخول (`must_change_password`)، ولها مدة صلاحية. ما دام التغيير مطلوباً: كل endpoint عدا `auth/change-password`
    و`auth/logout` و`auth/me` يرجع `403 PASSWORD_CHANGE_REQUIRED`.

    - لا إرسال آلي (لا SMS ولا واتساب API): الرد يحتوي `whatsapp_message` نصاً جاهزاً تفتح به الواجهة محادثة واتساب مع رقم المستخدم. لا يوجد "نسيت كلمة السر": المالك يستعيد حسابه بأمر artisan من الخادم.


    **اشتراكات النوادي (الدفع يدوي، والتفعيل والإيقاف والتجديد من هذه اللوحة):**

    `trial` / `active` → بعد `ends_at`: `grace` (عمل كامل، `subscriptions.grace_days` = 3 أيام) → `expired` (قراءة فقط، `subscriptions.read_only_days` = 3 أيام) → `locked` (مقفل كلياً حتى التجديد). مع `suspended`
    و`cancelled` يدوياً. تواريخ المراحل بالحقلين `grace_ends_at` و`read_only_ends_at`، والتمديد أو التجديد يعيد النادي للعمل فوراً.


    **العزل والأمان:**

    - عزل النوادي على طبقتين: بالكود (Global Scope على `tenant_id`، والنادي من التوكن حصراً) وبقاعدة البيانات (PostgreSQL Row-Level Security). لوحة المنصة تتجاوز العزل صراحةً داخل مساراتها فقط.

    - قفل الدخول بعد محاولات فاشلة (بالرقم وبالـ IP)، حد عام للطلبات، ترويسات أمان لكل رد، وكل إجراء تغيير (POST/PATCH/PUT/DELETE) يُكتب بسجل التدقيق (للقراءة فقط).

    - النظام بالعربية فقط.

    '
  license:
    name: Proprietary
    url: https://example.com/license
servers:
- url: /api/v1/super-admin
security:
- bearerAuth: []
tags:
- name: Super Admin - Auth
  description: دخول المشرف وحسابه وجلساته
- name: Super Admin - Search
  description: البحث الشامل بالداشبورد
- name: Super Admin - Analytics
  description: إحصائيات المنصة على مستوى كل النوادي (قراءة فقط)
- name: Super Admin - Tenants
  description: إدارة النوادي - إنشاء وتعديل وإيقاف وتفعيل وأرشفة وإعدادات
- name: Super Admin - Plans
  description: 'خطط الاشتراك: الأسعار والحدود والميزات'
- name: Super Admin - Subscriptions
  description: 'اشتراكات النوادي: إنشاء وتجديد وتمديد وتغيير خطة وتجاوزات'
- name: Super Admin - Finance
  description: الفواتير والدفعات اليدوية وكشوف حسابات النوادي
- name: Super Admin - Users
  description: مستخدمو النوادي على مستوى المنصة (للدعم الفني)
- name: Super Admin - Impersonation
  description: الدخول كمستخدم بنادي لأغراض الدعم
- name: Super Admin - Support Tickets
  description: تذاكر الدعم بين النوادي وفريق المنصة
- name: Super Admin - Announcements
  description: إعلانات المنصة للنوادي ومستخدميها
- name: Super Admin - Message Templates
  description: نصوص رسائل واتساب اليدوية والإشعارات
- name: Super Admin - Admins
  description: حسابات فريق المنصة (مالك واحد ومشرفون بنفس الصلاحيات) وجلساتهم
- name: Super Admin - Audit Log
  description: سجل كل الإجراءات (قراءة فقط)
- name: Super Admin - Notifications
  description: إشعارات المشرف داخل الداشبورد
- name: Super Admin - Settings
  description: إعدادات النظام ووضع الصيانة
- name: Super Admin - App Versions
  description: إصدارات تطبيقات الموبايل والتحديث الإجباري
- name: Super Admin - System
  description: صحة النظام والمهام الفاشلة والنسخ الاحتياطية
paths:
  /auth/login:
    post:
      tags:
      - Super Admin - Auth
      operationId: authLogin
      summary: تسجيل الدخول
      description: '[جديد] دخول برقم الموبايل وكلمة السر. بعد 5 محاولات فاشلة يُقفل الدخول مؤقتاً (429). عند القفل يصل تنبيه security_login_locked لصاحب الحساب وللمالكين، والدخول من متصفح أو جهاز جديد يرسل
        security_new_device. إذا كان must_change_password = true فالتوكن لا يفتح إلا auth/change-password و auth/logout و auth/me.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: بصيغة E.164 أو محلية وتُوحَّد بالخادم
                password:
                  type: string
                  format: password
                device_name:
                  type: string
                  description: اسم يظهر بقائمة الجلسات
              required:
              - phone
              - password
            example:
              phone: '+963911000009'
              password: <password>
              device_name: Chrome على Windows
      responses:
        '200':
          description: تم تسجيل الدخول بنجاح
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        token:
                          type: string
                        token_type:
                          type: string
                        expires_at:
                          type: string
                          format: date-time
                        must_change_password:
                          type: boolean
                        admin:
                          $ref: '#/components/schemas/Admin'
              example:
                success: true
                message: تم تسجيل الدخول بنجاح
                data:
                  token: <token>
                  token_type: Bearer
                  expires_at: '2026-10-08T10:00:00Z'
                  must_change_password: false
                  admin:
                    id: 2
                    name: م. خالد أحمد
                    phone: '+966551122334'
                    email: admin2@tamkin.com
                    status: active
                    role: admin
                    must_change_password: true
                    suspended_at: null
                    suspension_reason: null
                    last_login_at: null
                    last_login_ip: null
                    created_by:
                      id: 1
                      name: مشرف النظام
                    created_at: '2026-10-07T10:00:00Z'
                    updated_at: '2026-10-07T10:00:00Z'
                    deleted_at: null
        '401':
          description: بيانات الدخول غير صحيحة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: رقم الموبايل أو كلمة السر غير صحيحة
                code: INVALID_CREDENTIALS
        '403':
          description: الحساب موقوف
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: تم إيقاف هذا الحساب
                code: ACCOUNT_SUSPENDED
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/logout:
    post:
      tags:
      - Super Admin - Auth
      operationId: authLogout
      summary: تسجيل الخروج
      description: '[جديد] ينهي الجلسة الحالية فقط.'
      responses:
        '200':
          description: تم تسجيل الخروج بنجاح
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                success: true
                message: تم تسجيل الخروج بنجاح
                data: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/me:
    get:
      tags:
      - Super Admin - Auth
      operationId: authMe
      summary: حسابي
      description: '[جديد] بيانات المشرف صاحب التوكن.'
      responses:
        '200':
          description: تم جلب البيانات بنجاح
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Admin'
              example:
                success: true
                message: تم جلب البيانات بنجاح
                data:
                  id: 2
                  name: م. خالد أحمد
                  phone: '+966551122334'
                  email: admin2@tamkin.com
                  status: active
                  role: admin
                  must_change_password: true
                  suspended_at: null
                  suspension_reason: null
                  last_login_at: null
                  last_login_ip: null
                  created_by:
                    id: 1
                    name: مشرف النظام
                  created_at: '2026-10-07T10:00:00Z'
                  updated_at: '2026-10-07T10:00:00Z'
                  deleted_at: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      tags:
      - Super Admin - Auth
      operationId: authMeUpdate
      summary: تعديل حسابي
      description: '[جديد] الاسم والبريد فقط. رقم الموبايل يغيّره المالك من كروب Admins.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                  nullable: true
            example:
              name: م. خالد أحمد العلي
      responses:
        '200':
          description: تم تعديل البيانات بنجاح
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Admin'
              example:
                success: true
                message: تم تعديل البيانات بنجاح
                data:
                  id: 2
                  name: م. خالد أحمد
                  phone: '+966551122334'
                  email: admin2@tamkin.com
                  status: active
                  role: admin
                  must_change_password: true
                  suspended_at: null
                  suspension_reason: null
                  last_login_at: null
                  last_login_ip: null
                  created_by:
                    id: 1
                    name: مشرف النظام
                  created_at: '2026-10-07T10:00:00Z'
                  updated_at: '2026-10-07T10:00:00Z'
                  deleted_at: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/change-password:
    post:
      tags:
      - Super Admin - Auth
      operationId: authChangePassword
      summary: تغيير كلمة السر
      description: '[جديد] يلغي must_change_password وينهي كل الجلسات الأخرى. الكلمة الجديدة 8 خانات على الأقل وتختلف عن الحالية.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                new_password_confirmation:
                  type: string
                  format: password
              required:
              - current_password
              - new_password
              - new_password_confirmation
            example:
              current_password: <current>
              new_password: <new>
              new_password_confirmation: <new>
      responses:
        '200':
          description: تم تغيير كلمة السر بنجاح
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                success: true
                message: تم تغيير كلمة السر بنجاح
                data: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/change-phone:
    post:
      tags:
      - Super Admin - Auth
      operationId: authChangePhone
      summary: تغيير رقم موبايل حسابي
      description: '[جديد] رقم الموبايل هو معرّف الدخول، فيُغيَّر للحساب نفسه فقط وبتأكيد كلمة السر الحالية. هو الطريق الوحيد لتغيير رقم المالك (تعديل المشرفين يرفضه بـ 409). ينهي الجلسات الأخرى ويبقي الحالية.
        5 محاولات كل 10 دقائق.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                  description: محلي (09...) أو دولي (+963...)، والخادم يوحّده
                current_password:
                  type: string
                  format: password
              required:
              - phone
              - current_password
            example:
              phone: '+963945342091'
              current_password: <current>
      responses:
        '200':
          description: تم تغيير الرقم، ويرجع الحساب بالرقم الجديد
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      $ref: '#/components/schemas/Admin'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/sessions:
    get:
      tags:
      - Super Admin - Auth
      operationId: authSessions
      summary: جلساتي النشطة
      description: '[جديد]'
      responses:
        '200':
          description: تم جلب الجلسات بنجاح
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '#/components/schemas/Session'
              example:
                success: true
                message: تم جلب الجلسات بنجاح
                data:
                - id: 88
                  device: Chrome على Windows
                  ip_address: 185.10.20.30
                  last_used_at: '2026-10-07T09:58:00Z'
                  created_at: '2026-10-06T08:00:00Z'
                  is_current: true
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      tags:
      - Super Admin - Auth
      operationId: authSessionsDestroyOthers
      summary: إنهاء كل جلساتي الأخرى
      description: '[جديد] يبقي الجلسة الحالية فقط.'
      responses:
        '200':
          description: تم إنهاء الجلسات الأخرى
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        revoked_count:
                          type: integer
              example:
                success: true
                message: تم إنهاء الجلسات الأخرى
                data:
                  revoked_count: 2
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /auth/sessions/{session_id}:
    delete:
      tags:
      - Super Admin - Auth
      operationId: authSessionsDestroy
      summary: إنهاء جلسة من جلساتي
      description: '[جديد]'
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: تم إنهاء الجلسة
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      nullable: true
              example:
                success: true
                message: تم إنهاء الجلسة
                data: null
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /search:
    get:
      tags:
      - Super Admin - Search
      operationId: globalSearch
      summary: بحث شامل
      description: '[جديد] مربع البحث العلوي بالداشبورد. يرجع أول 5 نتائج من كل نوع.'
      parameters:
      - name: q
        in: query
        description: حرفان على الأقل
        schema:
          type: string
      - name: types
        in: query
        description: 'أنواع مفصولة بفاصلة: tenants,users,invoices,tickets'
        schema:
          type: string
      responses:
        '200':
          description: تم البحث بنجاح
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        tenants:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              slug:
                                type: string
                              status:
                                type: string
                        users:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                              phone:
                                type: string
                        invoices:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: integer
                              number:
                                type: string
                              tenant_name:
                                type: string
                              status:
                                type: string
