        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: تم إنشاء رابط التحميل
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SuccessEnvelope'
                - type: object
                  properties:
                    data:
                      type: object
                      properties:
                        download_url:
                          type: string
                        expires_at:
                          type: string
                          format: date-time
              example:
                success: true
                message: تم إنشاء رابط التحميل
                data:
                  download_url: https://cdn.example.com/backups/40.zip?signature=abc
                  expires_at: '2026-10-07T10:10:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: النسخة غير مكتملة
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                success: false
                message: النسخة غير مكتملة
                code: CONFLICT
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
