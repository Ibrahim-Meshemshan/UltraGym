          content:
            application/json:
              example:
                success: false
                message: الرابط منتهي الصلاحية أو غير صالح.
                code: FORBIDDEN
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/ServerError'
  /files/backups/{backup_id}:
    get:
      tags:
      - Super Admin - System
      operationId: filesBackup
      summary: تحميل نسخة احتياطية (رابط موقّع)
      security: []
      parameters:
      - name: backup_id
        in: path
        required: true
        schema:
          type: string
      - name: expires
        in: query
        required: true
        schema:
          type: integer
      - name: signature
        in: query
        required: true
        schema:
          type: string
      description: رابط مؤقت موقّع يُعطى بالحقل `download_url` أو `url`، بلا توكن. ينتهي بعد مدته، وأي تعديل على الرابط يُبطله (`403`).
      responses: *id005
  /files/private:
    get:
      tags:
      - Super Admin - System
      operationId: filesPrivate
      summary: عرض ملف خاص (شعار، إيصال، مرفق) برابط موقّع
      security: []
      parameters:
      - name: path
        in: query
        required: true
        schema:
          type: string
      - name: expires
        in: query
        required: true
        schema:
          type: integer
      - name: signature
        in: query
        required: true
        schema:
          type: string
      description: رابط مؤقت موقّع يُعطى بالحقل `download_url` أو `url`، بلا توكن. ينتهي بعد مدته، وأي تعديل على الرابط يُبطله (`403`).
      responses: *id005
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 15
    SortDir:
      name: sort_dir
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
        default: desc
    From:
      name: from
      in: query
      description: بداية الفترة (شاملة)
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      description: نهاية الفترة (شاملة)، يجب أن تكون بعد from أو تساويها
      schema:
        type: string
        format: date
    TenantId:
      name: tenant_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    InvoiceId:
      name: invoice_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    AdminId:
      name: admin_id
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    Interval:
      name: interval
      in: query
      description: حجم كل نقطة بالسلسلة الزمنية
      schema:
        type: string
        enum:
        - day
        - week
        - month
        default: month
  responses:
    Unauthenticated:
      description: غير مسجل دخول أو التوكن منتهي
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: يجب تسجيل الدخول أولاً
            code: UNAUTHENTICATED
    Forbidden:
      description: الحساب ليس سوبر أدمن أو لا يملك الصلاحية المطلوبة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: ليس لديك صلاحية لتنفيذ هذا الإجراء
            code: FORBIDDEN
    NotFound:
      description: العنصر غير موجود
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: العنصر المطلوب غير موجود
            code: NOT_FOUND
    LastOwnerConflict:
      description: الإجراء على النفس أو على مالك المنصة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: لا يمكن تنفيذ هذا الإجراء على حسابك أو على مالك المنصة
            code: CONFLICT
    ValidationError:
      description: بيانات غير صالحة
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: البيانات المدخلة غير صالحة
            code: VALIDATION_ERROR
            errors:
              to:
              - تاريخ النهاية يجب أن يكون بعد تاريخ البداية أو يساويه
              per_page:
              - القيمة يجب ألا تتجاوز 100
    TooManyRequests:
      description: تجاوز حد الطلبات
      headers:
        Retry-After:
          description: عدد الثواني قبل إعادة المحاولة
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: عدد الطلبات كبير، حاول بعد قليل
            code: TOO_MANY_REQUESTS
    ServerError:
      description: خطأ غير متوقع بالخادم
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            success: false
            message: حدث خطأ غير متوقع
            code: SERVER_ERROR
  schemas:
    SuccessEnvelope:
      type: object
      required:
      - success
      - message
      - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          nullable: true
          description: البيانات (حسب الـ endpoint)
    ErrorEnvelope:
      type: object
      required:
      - success
      - message
      - code
      properties:
        success:
          type: boolean
          example: false
        message:
          type: string
        code:
          type: string
          description: كود ثابت يعتمد عليه الفرونت بدل نص الرسالة
          enum:
          - UNAUTHENTICATED
          - INVALID_CREDENTIALS
          - FORBIDDEN
          - ACCOUNT_SUSPENDED
          - PASSWORD_CHANGE_REQUIRED
          - NOT_FOUND
          - CONFLICT
          - VALIDATION_ERROR
          - TOO_MANY_REQUESTS
          - MAINTENANCE
          - SERVER_ERROR
        errors:
          type: object
          description: يظهر مع 422 فقط
          additionalProperties:
            type: array
            items:
              type: string
    PaginationMeta:
      type: object
      properties:
        pagination:
          type: object
          required:
          - current_page
          - per_page
          - total
          - last_page
          properties:
            current_page:
              type: integer
            per_page:
              type: integer
            total:
              type: integer
            last_page:
              type: integer
            from:
              type: integer
              nullable: true
            to:
              type: integer
              nullable: true
    TenantStatus:
      type: string
      description: الحالة الإدارية فقط. التجريبي والمنتهي حالات اشتراك (SubscriptionStatus)
      enum:
      - active
      - suspended
      - archived
    SubscriptionStatus:
      type: string
      enum:
      - trial
      - active
      - grace
      - expired
      - locked
      - cancelled
      - suspended
    Period:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        interval:
          type: string
          enum:
          - day
          - week
          - month
    PlanRef:
      type: object
      nullable: true
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
    UsageMetric:
      type: object
      properties:
        used:
          type: integer
        limit:
          type: integer
          nullable: true
          description: null يعني غير محدود
        percent:
          type: number
          nullable: true
    Overview:
      type: object
      properties:
        tenants:
          type: object
          properties:
            total:
              type: integer
            active:
              type: integer
            trial:
              type: integer
            suspended:
              type: integer
            expired:
              type: integer
            archived:
              type: integer
            without_subscription:
              type: integer
            new_this_month:
              type: integer
        users:
          type: object
          properties:
            total:
              type: integer
            club_owners:
              type: integer
            receptionists:
              type: integer
            players:
              type: integer
        subscriptions:
          type: object
          properties:
            active:
              type: integer
            trial:
              type: integer
            grace:
              type: integer
            expired:
              type: integer
            locked:
              type: integer
              description: مقفل بعد انتهاء مهلة القراءة فقط
            cancelled:
              type: integer
            expiring_in_7_days:
              type: integer
            expiring_in_30_days:
              type: integer
        revenue:
          type: object
          properties:
            currency:
              type: string
            mrr:
              type: number
            this_month:
              type: number
            last_month:
              type: number
            change_percent:
              type: number
              nullable: true
            outstanding:
              type: number
        activity:
          type: object
          properties:
            active_tenants_today:
              type: integer
            active_users_today:
              type: integer
            check_ins_today:
              type: integer
        alerts:
          type: object
          properties:
            tenants_near_limit:
              type: integer
            overdue_invoices:
              type: integer
            open_support_tickets:
              type: integer
            failed_jobs:
              type: integer
        generated_at:
          type: string
          format: date-time
    TenantSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        logo_url:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/TenantStatus'
        plan:
          $ref: '#/components/schemas/PlanRef'
        subscription:
          type: object
          nullable: true
          properties:
            status:
              $ref: '#/components/schemas/SubscriptionStatus'
            starts_at:
              type: string
              format: date
            ends_at:
              type: string
              format: date
              nullable: true
            days_remaining:
              type: integer
              nullable: true
        counts:
          type: object
          properties:
            players:
              type: integer
            staff:
              type: integer
            branches:
              type: integer
        usage:
          type: object
          properties:
            players_limit:
              type: integer
              nullable: true
            players_percent:
