  /analytics/operations:
    get:
      tags:
      - Super Admin - Analytics
      operationId: analyticsOperations
      summary: المؤشرات التشغيلية على مستوى المنصة
      description: أرقام مجمّعة فقط (حضور، لاعبون جدد، اشتراكات مباعة، إيرادات النوادي بالدولار) دون أي بيانات شخصية للاعبين. تُملأ من tenant_daily_stats (تجميع يومي).
      parameters:
      - name: refresh
