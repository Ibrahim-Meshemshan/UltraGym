<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>شاشة الاستقبال · تجهيز الجهاز · UltraGym v1</title>
<style>
@font-face{font-family:'Changa';src:url(assets/Changa-VariableFont_wght.ttf) format('truetype');font-weight:200 800;font-display:swap}
@font-face{font-family:'Readex Pro';src:url(assets/ReadexPro-VariableFont_wght.ttf) format('truetype');font-weight:160 700;font-display:swap}
body{margin:0;background:var(--bg)}
a{color:var(--p-ink);text-decoration:none}a:hover{color:var(--p-ink2)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.cut{background:var(--line);padding:1px;border-radius:16px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.cut>.in{background:var(--surface);border-radius:15px;clip-path:polygon(0 0,calc(100% - 17.6px) 0,100% 17.6px,100% 100%,0 100%);height:100%;box-sizing:border-box}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.t-success{background:var(--s-soft);color:var(--s-ink)}.t-warning{background:var(--w-soft);color:var(--w-ink)}.t-danger{background:var(--d-soft);color:var(--d-ink)}.t-info{background:var(--i-soft);color:var(--i-ink)}.t-accent{background:var(--a-soft);color:var(--a-ink)}.t-neutral{background:var(--soft);color:var(--muted)}
.btn{height:46px;padding:0 20px;border-radius:10px;font-family:'Readex Pro',sans-serif;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;cursor:pointer;box-sizing:border-box;white-space:nowrap}
.btn-primary{background:var(--primary);color:#1A1A18;font-weight:600}.btn-secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}.btn-ghost{background:transparent;color:var(--p-ink);padding:0 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.rail{background:#1A1A17;flex:0 0 76px;width:76px;padding:16px 0;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px}
.ri{width:52px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#C9C9C0;position:relative}
.ri:hover{background:rgba(255,255,255,.05);color:#F3F3EE}
.ri.on{background:rgba(255,255,255,.10);color:#FF5A1F}
.ri.on::after{content:'';position:absolute;right:-12px;top:10px;bottom:10px;width:4px;border-radius:4px;background:#FF5A1F}
.top{min-height:64px;display:flex;align-items:center;gap:12px;padding:8px 24px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap;box-sizing:border-box}
.iconbtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;position:relative}
.search{display:flex;align-items:center;gap:12px;height:60px;padding:0 20px;border:2px solid var(--inv);border-radius:16px;background:var(--surface);box-sizing:border-box}
.search input{flex:1;min-width:0;border:0;outline:none;font-family:'Readex Pro',sans-serif;font-size:17px;color:var(--ink);background:transparent}
.hd{display:flex;align-items:center;gap:12px;padding:16px 24px;font-size:15px;font-weight:600}
.feed{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--divider);font-size:13px}
.av{width:34px;height:34px;border-radius:999px;background:var(--p-soft);color:var(--p-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:0 0 auto}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-family:'Readex Pro',sans-serif;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer}
.qa[disabled]{opacity:.45;cursor:not-allowed}
.slab{width:38px;height:38px;border-radius:10px;background:var(--p-soft);color:var(--p-ink);display:flex;align-items:center;justify-content:center;transform:skewX(-10deg)}
.slab>svg{transform:skewX(10deg)}
.ctab{border:0;background:transparent;font-family:'Readex Pro',sans-serif;cursor:pointer}
.sel{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;font-family:'Readex Pro',sans-serif;font-size:14px;color:var(--ink);box-sizing:border-box;width:100%}
.fi{display:flex;flex-direction:column;gap:6px;min-width:0}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:3px}
.seg button{height:36px;padding:0 16px;border-radius:8px;border:0;background:transparent;font-family:'Readex Pro',sans-serif;font-size:13px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(26,26,23,.08)}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-family:'Readex Pro',sans-serif;font-size:12.5px;color:var(--muted);cursor:pointer}
.chip.on{background:var(--inv);border-color:var(--inv);color:var(--on-inv)}
.sw{width:40px;height:24px;border-radius:999px;background:var(--line);position:relative;display:inline-block;flex:0 0 40px}
.sw::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#FFFFFE}
.sw.on{background:var(--primary)}.sw.on::after{right:auto;left:3px}
.stat{flex:1 1 180px;border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat span{font-size:12.5px;color:var(--muted)}
.stat strong{font-family:'Changa',sans-serif;font-size:24px;font-weight:700}
.av{width:36px;height:36px;border-radius:999px;background:var(--soft);color:var(--muted);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:0 0 36px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:9px 0;border-top:1px solid var(--divider)}
.kv>span:first-child{color:var(--muted)}
.h2{margin:0;font-size:16px;line-height:26px;font-weight:600}
.btn-danger{background:#D6335A;color:#FFFFFF}
.btn-dline{background:var(--surface);border-color:var(--d-line);color:var(--d-ink)}
.ov{position:absolute;inset:0;background:rgba(26,26,23,.5);display:flex;align-items:flex-start;justify-content:center;padding:96px 16px;box-sizing:border-box}
.dlg{max-width:600px;padding:24px;display:flex;flex-direction:column;gap:16px}
.dh{display:flex;justify-content:space-between;align-items:center}
.dh h2{margin:0;font-size:19px;line-height:30px;font-weight:600}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{background:var(--soft);color:var(--muted);font-weight:500;font-size:12.5px;text-align:right;padding:10px 14px;white-space:nowrap}
.tbl td{padding:12px 14px;border-top:1px solid var(--divider);vertical-align:middle}
.input{height:50px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 14px;font-family:'Readex Pro',sans-serif;font-size:18px;color:var(--ink);box-sizing:border-box;width:100%}
.lbl{font-size:12.5px;font-weight:500;color:var(--muted)}
.dlg{background:var(--surface);border-radius:16px;box-shadow:0 24px 60px rgba(26,26,23,.16);width:100%;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.cur{flex:1 1 280px;min-width:0;border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:8px}
.ln{display:flex;justify-content:space-between;font-size:14px}
.ln span:first-child{color:var(--muted)}

.wiz{width:100%;max-width:560px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:32px;display:flex;flex-direction:column;gap:20px;box-sizing:border-box;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,0 100%)}
.stp{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.stp b{width:24px;height:24px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-family:'Changa',sans-serif;font-weight:700}
.stp.on{color:var(--ink);font-weight:600}.stp.on b{background:var(--primary);color:#1A1A18}
.stp.done b{background:var(--s-soft);color:var(--s-ink)}
.bar{height:10px;border-radius:999px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--primary);border-radius:999px}

.th-light{--bg:#F5F5F2;--surface:#FFFFFF;--soft:#EDEDE8;--line:#E0E0DA;--divider:#EDEDE8;--inv:#1A1A17;--on-inv:#F3F3EE;--ink:#1A1A17;--muted:#5F5F57;--faint:#8A8A80;--primary:#FF5A1F;--p-soft:#FFE8DC;--p-ink:#B53D0A;--p-ink2:#8E2F06;--s-soft:#E3F5EC;--s-ink:#0D7350;--w-soft:#FFF1D1;--w-ink:#8A5800;--d-soft:#FDE6EC;--d-ink:#B81F45;--d-line:#F3C2CF;--i-soft:#E6ECFF;--i-ink:#2A50C8;--a-soft:#EEF8D2;--a-ink:#4F7A00}
.th-dark{--bg:#121210;--surface:#1B1B18;--soft:#24241F;--line:#2E2E29;--divider:#26261F;--inv:#F3F3EE;--on-inv:#1A1A17;--ink:#F3F3EE;--muted:#A9A99F;--faint:#7A7A70;--primary:#FF6A30;--p-soft:#3A1C10;--p-ink:#FF8E5E;--p-ink2:#FFB08A;--s-soft:#163126;--s-ink:#3DD68C;--w-soft:#33280F;--w-ink:#F5B642;--d-soft:#3A1520;--d-ink:#FF7A95;--d-line:#5A2333;--i-soft:#1C2747;--i-ink:#8AA9FF;--a-soft:#263012;--a-ink:#C8F03C}
.th-dark{color-scheme:dark}
.th-dark .tbl tbody tr:hover{background:#24241F}
</style>
<link rel="stylesheet" href="proto.css">
</head>
<body>
<div id="dc-root"></div>
<template id="dc-src">
<div class="{{ themeCls }}" style="min-height:900px;display:flex;align-items:center;justify-content:center;font-family:'Readex Pro',sans-serif;color:var(--ink);direction:rtl;background:var(--bg);position:relative;padding:40px 16px;box-sizing:border-box"><div style="position:absolute;top:16px;left:16px;z-index:3"><button class="iconbtn" type="button" onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" title="{{ themeLabel }}"><template data-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></template><template data-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></template></button>
      </div>
  <div class="wiz">
    <div style="display:flex;align-items:center;justify-content:space-between"><img src="assets/ultragym-mark-dark.svg" alt="UltraGym" style="width:44px"><span style="font-size:12.5px;color:var(--muted)">ريم العلي · نادي القمة الرياضي</span></div>
    <div style="display:flex;gap:16px;flex-wrap:wrap"><span class="{{ s1 }}"><b>1</b>تسجيل الجهاز</span><span class="{{ s2 }}"><b>2</b>تحميل البيانات</span><span class="{{ s3 }}"><b>3</b>جاهز</span></div>

    <template data-if value="{{ isReg }}" hint-placeholder-val="{{ true }}"><form style="display:flex;flex-direction:column;gap:16px" onSubmit="{{ next }}">
      <div><h1 style="margin:0;font-size:24px;line-height:36px;font-weight:600">جهّز هذا الجهاز للاستقبال</h1><p style="margin:4px 0 0;font-size:14px;line-height:22px;color:var(--muted)">يحفظ بيانات الفرع ليكمل الدخول والبيع والقبض حتى لو انقطع الإنترنت. مرة واحدة لكل جهاز.</p></div>
      <div class="fi"><label class="lbl" for="d-b">الفرع</label><select id="d-b" class="input" style="font-size:15px"><option>الفرع الرئيسي – المزة</option><option>فرع المالكي</option></select></div>
      <div class="fi"><label class="lbl" for="d-n">اسم الجهاز</label><input id="d-n" class="input" style="font-size:15px" value="كاونتر الاستقبال الرئيسي"><span style="font-size:12px;color:var(--muted)">يظهر للمالك بصفحة أجهزة الاستقبال.</span></div>
      <button class="btn btn-primary" type="submit" style="height:52px;font-size:15px">تسجيل الجهاز وتحميل البيانات</button>
    </form></template>

    <template data-if value="{{ isDl }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:16px" role="status" aria-live="polite">
      <div><h1 style="margin:0;font-size:24px;line-height:36px;font-weight:600">تحميل بيانات الفرع</h1><p style="margin:4px 0 0;font-size:14px;color:var(--muted)">لا تغلق الصفحة حتى ينتهي التحميل.</p></div>
      <div class="bar" role="progressbar" aria-valuenow="62" aria-valuemin="0" aria-valuemax="100" aria-label="تقدم التحميل"><i style="width:62%"></i></div>
      <div style="display:flex;justify-content:space-between;font-size:13.5px"><span>الصفحة <span class="ltr">1</span> من <span class="ltr">2</span> · <span class="ltr">800 / 1,284</span> عضو</span><strong class="ltr" style="font-family:'Changa',sans-serif">62%</strong></div>
      <div class="grp" style="border:1px solid var(--line);border-radius:14px;padding:4px 16px">
        <div style="display:flex;justify-content:space-between;padding:10px 0;font-size:13.5px"><span>الإعدادات والخطط وسعر الصرف</span><span class="badge t-success">تم</span></div>
        <div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--divider);font-size:13.5px"><span>الأعضاء والاشتراكات</span><span class="badge t-info">جارٍ</span></div>
        <div style="display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--divider);font-size:13.5px"><span>مفاتيح رموز QR</span><span class="badge t-neutral">بالانتظار</span></div>
      </div>
      <button class="btn btn-secondary" type="button" onClick="{{ done }}">متابعة (للعرض)</button>
    </div></template>

    <template data-if value="{{ isReady }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:16px;align-items:flex-start">
      <span class="badge t-success" style="height:30px;padding:0 12px">الجهاز جاهز للعمل دون اتصال</span>
      <h1 style="margin:0;font-size:24px;line-height:36px;font-weight:600">كاونتر الاستقبال الرئيسي</h1>
      <p style="margin:0;font-size:14px;line-height:22px;color:var(--muted)">حُمّل 1,284 عضوًا. يحدّث البيانات كل 5 دقائق ما دام متصلًا.</p>
      <a class="btn btn-primary" href="Reception.html" style="height:52px;font-size:15px">فتح محطة الدخول</a>
    </div></template>

    <template data-if value="{{ isRevoked }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:14px">
      <span style="width:56px;height:56px;border-radius:999px;background:var(--d-soft);color:var(--d-ink);display:flex;align-items:center;justify-content:center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 0 0 0-18M5.6 5.6l12.8 12.8"/></svg></span>
      <h1 style="margin:0;font-size:24px;line-height:36px;font-weight:600">أوقف المالك هذا الجهاز</h1>
      <p style="margin:0;font-size:14px;line-height:22px;color:var(--muted)">العمل دون اتصال توقف على هذا الجهاز. لإعادته للعمل يجب تسجيله من جديد، بعد موافقة المالك.</p>
      <div style="display:flex;gap:10px"><button class="btn btn-primary" type="button" onClick="{{ restart }}">تسجيل الجهاز من جديد</button></div>
      <span style="font-family:ui-monospace,monospace;font-size:12px;color:var(--faint);direction:ltr">DEVICE_REVOKED · HTTP 409</span>
    </div></template>
  </div>
</div>
</template>
<script type="application/json" id="dc-props">{"step": {"editor": "enum", "options": ["register", "downloading", "ready", "revoked"], "default": "register", "section": "الخطوة"}, "theme": {"editor": "enum", "options": ["light", "dark"], "default": "light", "section": "المظهر"}, "$preview": {"width": 1440, "height": 900}}</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const v = this.__rv();
    const th = (this.state && this.state.__th) || this.props.theme || 'light';
    return Object.assign({}, v, { themeCls: 'th th-' + th, isDark: th === 'dark', isLight: th !== 'dark', themeLabel: th === 'dark' ? 'التبديل للوضع الفاتح' : 'التبديل للوضع الداكن', toggleTheme: () => this.setState({ __th: th === 'dark' ? 'light' : 'dark' }) });
  }
  __rv() {
    const st = (this.state && this.state.st) || this.props.step || 'register';
    const order = ['register', 'downloading', 'ready'];
    const i = order.indexOf(st);
    const c = (n) => st === 'revoked' ? 'stp' : (n < i ? 'stp done' : n === i ? 'stp on' : 'stp');
    const go = (v) => (e) => { if (e && e.preventDefault) e.preventDefault(); this.setState({ st: v }); };
    return { s1: c(0), s2: c(1), s3: c(2), isReg: st === 'register', isDl: st === 'downloading', isReady: st === 'ready', isRevoked: st === 'revoked', next: go('downloading'), done: go('ready'), restart: go('register') };
  }
}
</script>
<script src="runtime.js"></script>
</body>
</html>
