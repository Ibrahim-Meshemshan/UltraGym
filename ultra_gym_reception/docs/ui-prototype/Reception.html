<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الاستقبال · محطة الدخول · UltraGym v1</title>
<style>
@font-face{font-family:'Changa';src:url(assets/Changa-VariableFont_wght.ttf) format('truetype');font-weight:200 800;font-display:swap}
@font-face{font-family:'Readex Pro';src:url(assets/ReadexPro-VariableFont_wght.ttf) format('truetype');font-weight:160 700;font-display:swap}
body{margin:0;background:var(--bg)}
a{color:var(--p-ink);text-decoration:none}a:hover{color:var(--p-ink2)}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.cut{background:var(--line);padding:1px;border-radius:16px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.cut>.in{background:var(--surface);border-radius:15px;clip-path:polygon(0 0,calc(100% - 17.6px) 0,100% 17.6px,100% 100%,0 100%);height:100%;box-sizing:border-box}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.t-success{background:var(--s-soft);color:var(--s-ink)}.t-warning{background:var(--w-soft);color:var(--w-ink)}.t-danger{background:var(--d-soft);color:var(--d-ink)}.t-info{background:var(--i-soft);color:var(--i-ink)}.t-accent{background:var(--a-soft);color:var(--a-ink)}.t-neutral{background:var(--soft);color:var(--muted)}
.btn{height:46px;padding:0 20px;border-radius:10px;font-family:'Readex Pro',sans-serif;font-size:14px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;cursor:pointer;box-sizing:border-box;white-space:nowrap}
.btn-primary{background:var(--primary);color:#1A1A18;font-weight:600}.btn-secondary{background:var(--surface);border-color:var(--line);color:var(--ink)}.btn-ghost{background:transparent;color:var(--p-ink);padding:0 10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.rail{background:#1A1A17;flex:0 0 76px;width:76px;padding:16px 0;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:6px}
.ri{width:52px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#C9C9C0;position:relative}
.ri:hover{background:rgba(255,255,255,.05);color:#F3F3EE}
.ri.on{background:rgba(255,255,255,.10);color:#FF5A1F}
.ri.on::after{content:'';position:absolute;right:-12px;top:10px;bottom:10px;width:4px;border-radius:4px;background:#FF5A1F}
.top{min-height:64px;display:flex;align-items:center;gap:12px;padding:8px 24px;border-bottom:1px solid var(--line);background:var(--bg);flex-wrap:wrap;box-sizing:border-box}
.iconbtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;color:var(--ink);cursor:pointer;position:relative}
.search{display:flex;align-items:center;gap:12px;height:60px;padding:0 20px;border:2px solid var(--inv);border-radius:16px;background:var(--surface);box-sizing:border-box}
.search input{flex:1;min-width:0;border:0;outline:none;font-family:'Readex Pro',sans-serif;font-size:17px;color:var(--ink);background:transparent}
.hd{display:flex;align-items:center;gap:12px;padding:16px 24px;font-size:15px;font-weight:600}
.feed{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--divider);font-size:13px}
.av{width:34px;height:34px;border-radius:999px;background:var(--p-soft);color:var(--p-ink);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex:0 0 auto}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border:1px solid var(--line);border-radius:14px;background:var(--surface);font-family:'Readex Pro',sans-serif;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer}
.qa[disabled]{opacity:.45;cursor:not-allowed}
.slab{width:38px;height:38px;border-radius:10px;background:var(--p-soft);color:var(--p-ink);display:flex;align-items:center;justify-content:center;transform:skewX(-10deg)}
.slab>svg{transform:skewX(10deg)}

.th-light{--bg:#F5F5F2;--surface:#FFFFFF;--soft:#EDEDE8;--line:#E0E0DA;--divider:#EDEDE8;--inv:#1A1A17;--on-inv:#F3F3EE;--ink:#1A1A17;--muted:#5F5F57;--faint:#8A8A80;--primary:#FF5A1F;--p-soft:#FFE8DC;--p-ink:#B53D0A;--p-ink2:#8E2F06;--s-soft:#E3F5EC;--s-ink:#0D7350;--w-soft:#FFF1D1;--w-ink:#8A5800;--d-soft:#FDE6EC;--d-ink:#B81F45;--d-line:#F3C2CF;--i-soft:#E6ECFF;--i-ink:#2A50C8;--a-soft:#EEF8D2;--a-ink:#4F7A00}
.th-dark{--bg:#121210;--surface:#1B1B18;--soft:#24241F;--line:#2E2E29;--divider:#26261F;--inv:#F3F3EE;--on-inv:#1A1A17;--ink:#F3F3EE;--muted:#A9A99F;--faint:#7A7A70;--primary:#FF6A30;--p-soft:#3A1C10;--p-ink:#FF8E5E;--p-ink2:#FFB08A;--s-soft:#163126;--s-ink:#3DD68C;--w-soft:#33280F;--w-ink:#F5B642;--d-soft:#3A1520;--d-ink:#FF7A95;--d-line:#5A2333;--i-soft:#1C2747;--i-ink:#8AA9FF;--a-soft:#263012;--a-ink:#C8F03C}
.th-dark{color-scheme:dark}
.th-dark .tbl tbody tr:hover{background:#24241F}

.sk{background:linear-gradient(90deg,var(--soft,#24241F) 25%,var(--line,#2E2E29) 37%,var(--soft,#24241F) 63%);background-size:400% 100%;animation:skm 1.4s ease infinite;border-radius:8px}
@keyframes skm{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.pse{background:var(--surface,#1B1B18);border:1px solid var(--line,#2E2E29);border-radius:16px;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.pse .ico{width:56px;height:56px;border-radius:999px;background:var(--d-soft,#3A1520);color:var(--d-ink,#FF7A95);display:flex;align-items:center;justify-content:center}
</style>
<link rel="stylesheet" href="proto.css">
</head>
<body>
<div id="dc-root"></div>
<template id="dc-src">
<div class="{{ themeCls }}" style="min-height:980px;display:flex;flex-wrap:wrap;font-family:'Readex Pro',sans-serif;color:var(--ink);direction:rtl;background:var(--bg)">

  <nav class="rail" aria-label="قائمة الاستقبال">
    <img src="assets/ultragym-mark-dark.svg" alt="UltraGym" style="width:40px;margin-bottom:14px">
    <a class="ri on" href="Reception.html" aria-label="محطة الدخول" aria-current="page" title="محطة الدخول"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></svg></a>
    <a class="ri" href="SellMembership.html" aria-label="بيع اشتراك" title="بيع اشتراك"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg></a>
    <a class="ri" href="Members.html" aria-label="الأعضاء" title="الأعضاء"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7"/></svg></a>
    <a class="ri" href="ReceptionCash.html" aria-label="الصندوق" title="الصندوق"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v12H4zM4 7l2-3h12l2 3M16 13h2"/></svg></a>
    <a class="ri" href="ReceptionSync.html" aria-label="المزامنة" title="المزامنة"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14-5L4 8M4 4v4h4M4 13a8 8 0 0 0 14 5l2-2M20 20v-4h-4"/></svg></a>
  </nav>

  <div style="flex:999 1 560px;min-width:0;display:flex;flex-direction:column">
    <header class="top">
      <div style="margin-left:auto;display:flex;flex-direction:column">
        <strong style="font-size:18px;line-height:28px;font-weight:600">الفرع الرئيسي – المزة</strong>
        <span style="font-size:12px;color:var(--muted)">الأربعاء 4 تشرين الثاني · قسم: مختلط الآن</span>
      </div>
      <template data-if value="{{ online }}" hint-placeholder-val="{{ true }}"><span class="badge t-success" style="height:30px;padding:0 12px">متصل · آخر مزامنة 09:41</span></template>
      <template data-if value="{{ offline }}" hint-placeholder-val="{{ false }}"><span class="badge t-warning" style="height:30px;padding:0 12px">دون اتصال · 3 عمليات معلقة · آخر مزامنة 09:31</span></template>
      <span class="badge t-accent" style="height:30px;padding:0 12px">الوردية <span class="ltr">#48</span> مفتوحة</span>
      <button class="iconbtn" type="button" onClick="{{ toggleTheme }}" aria-label="{{ themeLabel }}" title="{{ themeLabel }}"><template data-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></template><template data-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></template></button>
      <button class="iconbtn" type="button" aria-label="الإشعارات، 2 غير مقروءة"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/></svg><span style="position:absolute;top:-4px;left:-4px;min-width:18px;height:18px;border-radius:999px;background:#C8F03C;color:#1A1A18;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center">2</span></button>
      <span style="display:flex;align-items:center;gap:8px"><span style="width:34px;height:34px;border-radius:999px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600">ر ع</span><span style="font-size:13px">ريم العلي</span></span>
    </header>

    <template data-if value="{{ offline }}" hint-placeholder-val="{{ false }}">
      <div role="status" style="padding:10px 24px;background:var(--w-soft);color:var(--w-ink);font-size:13px;line-height:22px">تعمل دون اتصال. الدخول والبيع والقبض تُحفظ على هذا الجهاز وتُرسل عند عودة الإنترنت. التقارير والإعدادات وفتح الصندوق وإغلاقه تحتاج اتصالًا.</div>
    </template>

    <main style="padding:24px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;max-width:1320px;width:100%;box-sizing:border-box">
<template data-if value="{{ psReady }}" hint-placeholder-val="{{ true }}"><div style="display:contents">

      <div style="flex:2 1 560px;min-width:0;display:flex;flex-direction:column;gap:16px">
        <div style="display:flex;gap:12px;flex-wrap:wrap">
          <label class="search" style="flex:1 1 360px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">ابحث عن عضو</span><input placeholder="الاسم أو الموبايل أو المعرّف · أو امسح الباركود" value="{{ query }}"></label>
          <button class="btn btn-secondary" type="button" style="height:60px;border-radius:16px;padding:0 24px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M8 8h3v3H8zM13 13h3v3h-3zM13 8h3M8 13v3"/></svg>مسح QR</button>
        </div>

        <section class="cut" aria-live="polite"><div class="in" style="display:flex;flex-direction:column">
          <template data-if value="{{ isAccepted }}" hint-placeholder-val="{{ true }}"><div class="hd" style="background:var(--s-soft);color:var(--s-ink)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>مقبول · تم تسجيل الدخول 09:42</div></template>
          <template data-if value="{{ isGrace }}" hint-placeholder-val="{{ false }}"><div class="hd" style="background:var(--w-soft);color:var(--w-ink)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 3l9 16H3zM12 10v4M12 17h.01"/></svg>مقبول بفترة السماح · انتهى الاشتراك أمس، ويدخل حتى 7 تشرين الثاني</div></template>
          <template data-if value="{{ isDuplicate }}" hint-placeholder-val="{{ false }}"><div class="hd" style="background:var(--soft);color:var(--muted)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>مسجّل مسبقًا منذ 35 دقيقة · لم يُسجَّل دخول جديد</div></template>
          <template data-if value="{{ isRejected }}" hint-placeholder-val="{{ false }}"><div class="hd" style="background:var(--d-soft);color:var(--d-ink)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>مرفوض · اشتراك اللاعب منتهٍ<span class="ltr" style="margin-right:auto;font-size:12px;font-weight:500;opacity:.8">EXPIRED</span></div></template>
          <template data-if value="{{ isGender }}" hint-placeholder-val="{{ false }}"><div class="hd" style="background:var(--d-soft);color:var(--d-ink)"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>مرفوض · ليس وقت قسم العضو الآن<span class="ltr" style="margin-right:auto;font-size:12px;font-weight:500;opacity:.8">GENDER_HOURS</span></div></template>

          <div style="padding:22px 24px;display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap">
            <span style="width:88px;height:88px;border-radius:20px;background:var(--p-soft);color:var(--p-ink);display:flex;align-items:center;justify-content:center;font-family:'Changa',sans-serif;font-size:30px;font-weight:700;flex:0 0 auto">{{ initials }}</span>
            <div style="flex:1 1 260px;min-width:0;display:flex;flex-direction:column;gap:8px">
              <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><strong style="font-size:22px;line-height:32px;font-weight:600">{{ name }}</strong><span class="{{ badgeClass }}">{{ statusLabel }}</span></div>
              <span style="font-size:13px;color:var(--muted)"><span class="ltr">{{ code }}</span> · <span class="ltr">{{ phone }}</span></span>
              <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:6px">
                <div style="background:var(--bg);border-radius:12px;padding:10px 14px"><span style="font-size:11.5px;color:var(--muted);display:block">الخطة</span><strong style="font-size:14px;font-weight:600">{{ plan }}</strong></div>
                <div style="background:var(--bg);border-radius:12px;padding:10px 14px"><span style="font-size:11.5px;color:var(--muted);display:block">{{ remainingLabel }}</span><strong style="font-size:14px;font-weight:600">{{ remaining }}</strong></div>
                <div style="background:{{ dueBg }};border-radius:12px;padding:10px 14px"><span style="font-size:11.5px;color:var(--muted);display:block">الدين</span><strong class="ltr" style="font-size:14px;font-weight:600;color:{{ dueColor }}">{{ due }}</strong></div>
              </div>
              <template data-if value="{{ isGender }}" hint-placeholder-val="{{ false }}"><p style="margin:4px 0 0;font-size:13px;line-height:22px;color:var(--muted)">أوقات قسم الإناث: السبت–الخميس <span class="ltr">08:00 – 14:00</span>. الاشتراك صالح.</p></template>
            </div>
          </div>
          <div style="padding:0 24px 22px;display:flex;gap:10px;flex-wrap:wrap">
            <template data-if value="{{ showRenewPrimary }}" hint-placeholder-val="{{ false }}"><a class="btn btn-primary" href="SellMembership.html">تجديد الاشتراك</a></template>
            <template data-if value="{{ showPay }}" hint-placeholder-val="{{ true }}"><button class="btn btn-secondary" type="button">سداد الدين <span class="ltr">{{ due }}</span></button></template>
            <a class="btn btn-ghost" href="Members.html">ملف العضو</a>
            <button class="btn btn-ghost" type="button" style="margin-right:auto;color:var(--muted)">عضو التالي</button>
          </div>
        </div></section>

        <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px">
          <button class="qa" type="button" disabled title="لاشتراكات الجلسات فقط"><span class="slab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2.5"/></svg></span>خصم جلسة</button>
          <a class="qa" href="SellMembership.html"><span class="slab" style="background:var(--primary);color:#1A1A18"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg></span>بيع أو تجديد</a>
          <button class="qa" type="button"><span class="slab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16v12H4zM4 7l2-3h12l2 3M16 13h2"/></svg></span>سداد دين</button>
          <button class="qa" type="button"><span class="slab"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M4 6l16 12M20 6L4 18"/></svg></span>تجميد</button>
        </div>
      </div>

      <div style="flex:1 1 320px;min-width:0;display:flex;flex-direction:column;gap:16px">
        <section class="cut"><div class="in" style="padding:18px 20px;display:flex;flex-direction:column">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px"><h2 style="margin:0;font-size:16px;line-height:26px;font-weight:600">دخول اليوم</h2><span style="font-size:12.5px;color:var(--muted)"><strong style="color:var(--s-ink)">214</strong> مقبول · <strong style="color:var(--d-ink)">9</strong> مرفوض</span></div>
          <template data-for list="{{ feed }}" as="f" hint-placeholder-count="7">
            <div class="feed">
              <span class="ltr" style="width:40px;color:var(--muted);font-size:12px">{{ f.time }}</span>
              <span class="av">{{ f.initials }}</span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column"><strong style="font-weight:500">{{ f.name }}</strong><span style="font-size:11.5px;color:var(--muted)">{{ f.method }}</span></span>
              <span class="{{ f.badgeClass }}">{{ f.status }}</span>
            </div>
          </template>
          <a class="btn btn-ghost" href="Attendance.html" style="align-self:flex-start;height:34px;font-size:13px;margin-top:6px">سجل الحضور الكامل</a>
        </div></section>

        <section class="cut"><div class="in" style="padding:18px 20px;display:flex;flex-direction:column;gap:12px">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px"><h2 style="margin:0;font-size:16px;line-height:26px;font-weight:600">الصندوق</h2><span class="badge t-accent">مفتوحة منذ 08:05</span></div>
          <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px">
            <div style="background:var(--bg);border-radius:10px;padding:8px 12px"><span style="font-size:11.5px;color:var(--muted);display:block">المتوقع بالدولار</span><strong class="ltr" style="font-size:16px;font-weight:600">$412.00</strong></div>
