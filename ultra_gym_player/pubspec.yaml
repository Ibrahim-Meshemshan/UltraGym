name: ultra_gym_player
description: "تطبيق العضو · Android / iOS · UltraGym"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  app_settings: ^6.1.1  # آخر نسخة تدعم CocoaPods (9.x تتطلب Swift Package Manager)
  connectivity_plus: ^7.3.1
  cryptography: ^2.9.0
  dio: ^5.11.1
  equatable: ^2.1.0
  file_picker: ^11.0.3
  fl_chart: ^1.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^10.3.4
  flutter_svg: ^2.2.3
  get_it: ^9.3.0
  go_router: ^17.0.0
  internet_connection_checker_plus: ^3.1.2
  intl: ^0.20.2
  open_filex: ^5.0.0
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  screen_brightness: ^2.1.11
  shared_preferences: ^2.5.3
  shimmer: ^3.0.0
  timezone: ^0.10.1
  ultragym_design:
    path: packages/ultragym_design
  url_launcher: ^6.3.2
  uuid: ^4.6.0
  web: ^1.1.1
  webview_flutter: ^4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/icons/
    - assets/ornaments/

# أيقونة التطبيق: dart run flutter_launcher_icons (هوية §13)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/app-icon-charcoal-1024.png"
  adaptive_icon_background: "assets/brand/android-adaptive-background-432.png"
  adaptive_icon_foreground: "assets/brand/android-adaptive-foreground-432.png"
  remove_alpha_ios: true

# شاشة البدء الأصلية: dart run flutter_native_splash:create (هوية §13)
flutter_native_splash:
  color: "#1A1A17"
  image: "assets/brand/ultragym-vertical-dark.png"
  color_dark: "#121210"
  image_dark: "assets/brand/ultragym-vertical-dark.png"
  android_12:
    color: "#1A1A17"
    image: "assets/brand/app-icon-charcoal-1024.png"
    color_dark: "#121210"
  web: false
