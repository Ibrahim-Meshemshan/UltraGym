    post:
      tags:
      - Player App - QR Keys
      operationId: playerPostQrKeys
      summary: تسجيل المفتاح العام لهذا الجهاز
      description: '**الصلاحية:** اللاعب نفسه (`player`)، ببيانات ناديه الحالي فقط.


        **الخطوات بالتطبيق (مرة لكل جهاز):**

        1. ولّد زوج مفاتيح Ed25519 (مثلاً بمكتبة `cryptography` أو `sodium`)، واحفظ المفتاح الخاص بالتخزين الآمن للجهاز (Keychain / Keystore). **لا يُرسل أبداً.**

        2. أرسل المفتاح العام (32 بايت، base64) مع اسم الجهاز، واحفظ `key_id` الراجع.

        3. لعرض رمز الدخول: `message = "UG1.{key_id}.{unix_seconds}"`، ووقّعه بالمفتاح الخاص، والرمز `message + "." + base64url(signature)` بلا `=`. جدّده كل 10 ثوانٍ (صالح 30 ثانية).


        اسم الجهاز نفسه يستبدل مفتاحه السابق، وأكثر من 3 أجهزة فعّالة يلغي الأقدم. المفتاح للحساب نفسه فيعمل بكل نوادي اللاعب. نفس المفتاح العام مرتين: `409`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                public_key:
                  type: string
                device_name:
                  type: string
              required:
              - device_name
              - public_key
            examples:
              ex1:
                summary: تسجيل مفتاح الجهاز
                value:
                  public_key: TsVh8w2N01ttOW62t7zXJ/qHUOIFtKoCz0qYLu9tpU4=
                  device_name: Samsung A54
              ex2:
