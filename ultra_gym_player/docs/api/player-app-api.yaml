        كل ما تحتاجه الشاشة الرئيسية بطلب واحد:

        - `membership`: الاشتراك الحالي بالأولوية: فعّال، ثم بفترة السماح، ثم مجمّد، ثم القادم الأقرب، ثم آخر منتهٍ. `null` إن لم يوجد.

        - `next_membership`: تجديد مسبق يبدأ بعد الحالي.

        - `alerts`: تنبيهات جاهزة للعرض بالترتيب: `no_membership` `expired` `grace` `frozen` `upcoming` `sessions_low` `expires_soon` (7 أيام) `due`، ولكل منها `level`: `danger` `warning`
        `info`.

        - `due_usd` / `due_syp`: مجموع الدين على كل اشتراكاتي غير الملغاة (الليرة بسعر اليوم).

        - `attendance`: هل دخلت اليوم، أيام هذا الشهر والماضي، وآخر دخول.

        - `access`: فرعي ونظامه (`mixed` أو `time_split` لأقسام الذكور والإناث)، و`my_hours` أوقات قسمي (`null` للمختلط)، و`open_for_me_now` هل أستطيع الدخول الآن، و`reason` (`GENDER_HOURS`
