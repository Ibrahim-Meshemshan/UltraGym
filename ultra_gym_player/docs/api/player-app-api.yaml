openapi: 3.0.3
info:
  title: UltraGym - Player App API
  version: 1.0.0
  description: 'واجهات تطبيق اللاعب (Flutter Mobile). كل المسارات تحت `/api/v1/player`، وتتطلب ميزة `player_app` بخطة النادي.


    **الدخول:** `POST /api/v1/auth/login` مع `app = player_app` (الموبايل أو معرّف العضو + كلمة السر). الجلسة 90 يوماً وتتجدد وحدها مع الاستعمال (ترويسة `X-Session-Expires-At`). لاعب
    بأكثر من نادٍ: يختار النادي عند الدخول (`requires_tenant_selection`) ويبدّل لاحقاً من `clubs/switch`. كلمة السر المؤقتة تُغيَّر أولاً من `POST /api/v1/profile/change-password` (قبلها
    `403 PASSWORD_CHANGE_REQUIRED`).


    **العزل:** اللاعب يرى نفسه فقط بناديه الحالي. سجل لاعب آخر أو نادٍ آخر بأي مسار = `404`. مالك النادي والاستقبال لا يدخلون هذه المسارات (`403`).


    **المال:** الدولار عملة الحساب (`*_usd`)، وما يقابلها بالليرة (`*_syp`) بسعر صرف النادي اليوم. الدفع من استقبال النادي، والتطبيق يعرض الدين والإيصالات.


    **الحالات الفعلية للاشتراك** (`status`) محسوبة اليوم بتوقيت النادي: `active` `grace` (انتهى ويُسمح بالدخول أياماً) `frozen` `upcoming` `expired` `cancelled`، مع `status_label` بالعربي.


    **الإشعارات (FCM):** سجّل الجهاز بـ `POST /api/v1/devices` (`app = player_app`). أنواع `type` بالـ push: `club_announcement` (`announcement_id`) و`membership_reminder` (`subtype`:
    `expires_in_3` `expires_in_1` `expired`، و`membership_id`). التذكير يُرسل صباحاً مرة واحدة لكل اشتراك ونوع.


    **مشترك مع كل التطبيقات:** الإشعارات `GET /api/v1/notifications`، الملف وكلمة السر `/api/v1/profile`، ونسخة التطبيق `GET /api/v1/app-version`.


    **شكل الرد:** نجاح `{ success: true, message, data, meta? }` و`meta.pagination` بالقوائم؛ خطأ `{ success: false, message, code, errors? }`. اعتمد على `code`. كل ردود GET تدعم `ETag`
    / `If-None-Match` (304)، وكل رد فيه `X-Server-Time`.


    كل الأمثلة بهذا الملف ردود حقيقية من الخادم.'
servers:
- url: /api/v1/player
security:
- sanctum: []
tags:
- name: Player App - Home & Card
  description: الشاشة الرئيسية بطلب واحد، والبطاقة الرقمية.
- name: Player App - QR Keys
  description: 'مفاتيح رمز الدخول الموقّع Ed25519: المفتاح الخاص على الهاتف فقط، والرمز يتجدد دون إنترنت. تتطلب ميزة qr_attendance.'
- name: Player App - Memberships & Payments
  description: اشتراكاتي (الحالي والقادم والسابق)، الدين، الدفعات والإيصالات والفواتير PDF.
- name: Player App - Attendance
  description: سجل دخولي وإحصائياته للرسوم.
- name: Player App - Progress & Training
  description: 'قياسات الجسم والتقدّم، وبرامجي التدريبية: من النادي (للقراءة) ويلي بضيفها بنفسي.'
- name: Player App - Club & Plans
  description: معلومات النادي وفروعه، وخطط التجديد بالسعرين.
- name: Player App - Announcements
  description: إعلانات ناديّ الموجهة لي (الجمهور والفرع)، مع حالة القراءة.
- name: Player App - Account
  description: ملفي بالنادي وصورتي، ونواديّ والتبديل بينها.
