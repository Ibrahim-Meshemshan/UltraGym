<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تطبيق العضو · حضوري · UltraGym v1</title>
<style>
@font-face{font-family:'Changa';src:url(assets/Changa-VariableFont_wght.ttf) format('truetype');font-weight:200 800;font-display:swap}
@font-face{font-family:'Readex Pro';src:url(assets/ReadexPro-VariableFont_wght.ttf) format('truetype');font-weight:160 700;font-display:swap}
body{margin:0;background:#121210}
a{color:#FF8E5E;text-decoration:none}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.frame{background:#2E2E29;padding:1px;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.frame>.in{background:#1B1B18;clip-path:polygon(0 0,calc(100% - 21.6px) 0,100% 21.6px,100% 100%,21.6px 100%,0 calc(100% - 21.6px))}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:52px;border-radius:14px;font-size:11.5px;color:#A9A99F}
.bn.on{background:#3A1C10;color:#FF8E5E;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;gap:10px}
.row>span:first-child{color:#A9A99F}
.card{background:#1B1B18;border:1px solid #2E2E29;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.h2{margin:0;font-size:15px;line-height:24px;font-weight:600}
.bar{height:8px;border-radius:999px;background:#2E2E29;overflow:hidden}
.bar>i{display:block;height:100%;background:#C8F03C;border-radius:999px}
.grp{background:#1B1B18;border:1px solid #2E2E29;border-radius:16px;overflow:hidden}
.it{display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid #2E2E29;font-size:14px;color:#F3F3EE}
.it:first-child{border-top:0}
.it small{display:block;font-size:12px;color:#A9A99F;margin-top:2px}
.ic{width:36px;height:36px;border-radius:10px;background:#24241F;color:#FF8E5E;display:flex;align-items:center;justify-content:center;flex:0 0 36px}
.gl{font-size:12.5px;color:#A9A99F;margin:0 4px 8px}
.sw{width:40px;height:24px;border-radius:999px;background:#45453D;position:relative;display:inline-block;flex:0 0 40px}
.sw::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#F3F3EE}
.sw.on{background:#FF6A30}.sw.on::after{right:auto;left:3px}
.nt{display:flex;gap:12px;padding:14px 16px;border-top:1px solid #2E2E29}
.nt:first-child{border-top:0}
.nt.un{background:#20201C}
.dot{width:8px;height:8px;border-radius:50%;background:#FF6A30;flex:0 0 8px;margin-top:8px}
.seg2{display:flex;background:#1B1B18;border:1px solid #2E2E29;border-radius:12px;padding:3px;gap:3px}
.seg2 button{flex:1;height:36px;border:0;border-radius:9px;background:transparent;color:#A9A99F;font-family:'Readex Pro',sans-serif;font-size:13px}
.seg2 button.on{background:#3A1C10;color:#FF8E5E;font-weight:600}
.chip2{height:32px;padding:0 12px;border-radius:999px;border:1px solid #45453D;background:transparent;color:#C9C9C0;font-family:'Readex Pro',sans-serif;font-size:12.5px}
.chip2.on{background:#3A1C10;border-color:#3A1C10;color:#FF8E5E;font-weight:600}
.kpi{flex:1 1 0;background:#1B1B18;border:1px solid #2E2E29;border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi span{font-size:11.5px;color:#A9A99F}
.kpi strong{font-family:'Changa',sans-serif;font-size:22px;font-weight:700;color:#F3F3EE}
.cut{background:#2E2E29;padding:1px;border-radius:16px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.cut>.in{background:#1B1B18;border-radius:15px;clip-path:polygon(0 0,calc(100% - 17.6px) 0,100% 17.6px,100% 100%,0 100%);height:100%;box-sizing:border-box}

.sk{background:linear-gradient(90deg,var(--soft,#24241F) 25%,var(--line,#2E2E29) 37%,var(--soft,#24241F) 63%);background-size:400% 100%;animation:skm 1.4s ease infinite;border-radius:8px}
@keyframes skm{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.pse{background:var(--surface,#1B1B18);border:1px solid var(--line,#2E2E29);border-radius:16px;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.pse .ico{width:56px;height:56px;border-radius:999px;background:var(--d-soft,#3A1520);color:var(--d-ink,#FF7A95);display:flex;align-items:center;justify-content:center}
</style>
<link rel="stylesheet" href="proto.css">
</head>
<body class="ug-mobile">
<div id="dc-root"></div>
<template id="dc-src">
<div style="width:390px;min-height:1260px;position:relative;background:#121210;font-family:'Readex Pro',sans-serif;color:#F3F3EE;direction:rtl;padding-bottom:84px;box-sizing:border-box">
  <header style="display:flex;align-items:center;gap:12px;padding:18px 20px">
    <a href="MemberHome.html" aria-label="رجوع" style="width:38px;height:38px;border-radius:999px;border:1px solid #45453D;display:flex;align-items:center;justify-content:center;color:#F3F3EE;flex:0 0 38px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></a>
    <h1 style="margin:0;font-size:19px;line-height:30px;font-weight:600;flex:1">حضوري</h1>
  </header>
  <main style="padding:0 20px;display:flex;flex-direction:column;gap:16px">
<template data-if value="{{ psReady }}" hint-placeholder-val="{{ true }}"><div style="display:contents">
    <div style="display:flex;gap:8px;overflow:hidden"><button type="button" class="chip2">أسبوع</button><button type="button" class="chip2 on">شهر</button><button type="button" class="chip2">3 أشهر</button></div>
    <div style="display:flex;gap:10px">
      <div class="kpi"><span>آخر 30 يومًا</span><strong class="ltr">14</strong></div>
      <div class="kpi"><span>متوسط أسبوعي</span><strong class="ltr">3.5</strong></div>
      <div class="kpi"><span>أطول سلسلة</span><strong class="ltr">5</strong></div>
    </div>
    <section class="frame"><div class="in" style="padding:16px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="margin:0;font-size:15px;font-weight:600">تشرين الأول ‒ تشرين الثاني</h2><span style="font-size:12px;color:#A9A99F">كل مربع يوم</span></div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:10.5px;color:#7A7A70;text-align:center"><span>س</span><span>ح</span><span>ن</span><span>ث</span><span>ر</span><span>خ</span><span>ج</span></div>
      <div role="img" aria-label="أيام الحضور خلال آخر 5 أسابيع: 14 زيارة هذا الشهر" style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px">
        <template data-for list="{{ cal }}" as="c" hint-placeholder-count="35"><span style="aspect-ratio:1;border-radius:6px;background:{{ c.bg }};border:{{ c.bd }}"></span></template>
      </div>
      <div style="display:flex;gap:12px;font-size:11.5px;color:#A9A99F;align-items:center"><span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:#FF6A30"></span>حضرت</span><span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;background:#24241F"></span>لم تحضر</span><span style="display:flex;align-items:center;gap:6px"><span style="width:10px;height:10px;border-radius:3px;border:1.5px solid #C8F03C"></span>اليوم</span></div>
    </div></section>
    <section class="frame"><div class="in" style="padding:16px;display:flex;flex-direction:column;gap:10px">
      <h2 style="margin:0;font-size:15px;font-weight:600">أكثر ساعاتك</h2>
      <div role="img" aria-label="أغلب حضورك بين 6 و 8 مساءً" style="display:flex;align-items:flex-end;gap:6px;height:90px;direction:ltr"><template data-for list="{{ hours }}" as="h" hint-placeholder-count="8"><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end"><i style="display:block;width:100%;height:{{ h.v }}%;background:{{ h.c }};border-radius:4px 4px 0 0"></i><span style="font-size:10px;color:#7A7A70">{{ h.l }}</span></div></template></div>
    </div></section>
    <div><p class="gl">آخر الزيارات</p><div class="grp">
      <template data-for list="{{ log }}" as="l" hint-placeholder-count="5"><div class="it"><span class="ic" style="color:{{ l.c }};background:{{ l.bg }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{ l.p }}"/></svg></span><span style="flex:1">{{ l.d }}<small>{{ l.s }}</small></span><span class="ltr" style="font-size:13px;color:#A9A99F">{{ l.t }}</span></div></template>
    </div></div>
  </div></template>
<template data-if value="{{ psLoading }}" hint-placeholder-val="{{ false }}"><div style="display:contents" role="status" aria-live="polite"><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">جارٍ التحميل</span>
      <span class="sk" style="display:block;width:100%;height:150px;border-radius:18px"></span>
      <div style="display:flex;gap:10px"><span class="sk" style="display:block;width:100%;height:64px;border-radius:14px"></span><span class="sk" style="display:block;width:100%;height:64px;border-radius:14px"></span><span class="sk" style="display:block;width:100%;height:64px;border-radius:14px"></span></div>
      <div style="background:var(--surface,#1B1B18);border:1px solid var(--line,#2E2E29);border-radius:16px;overflow:hidden"><div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line,#2E2E29)"><span class="sk" style="display:block;width:36px;height:36px;border-radius:10px;flex:0 0 36px"></span><span style="flex:1;display:flex;flex-direction:column;gap:8px"><span class="sk" style="display:block;width:60%;height:12px;"></span><span class="sk" style="display:block;width:35%;height:10px;"></span></span></div><div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line,#2E2E29)"><span class="sk" style="display:block;width:36px;height:36px;border-radius:10px;flex:0 0 36px"></span><span style="flex:1;display:flex;flex-direction:column;gap:8px"><span class="sk" style="display:block;width:60%;height:12px;"></span><span class="sk" style="display:block;width:35%;height:10px;"></span></span></div><div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line,#2E2E29)"><span class="sk" style="display:block;width:36px;height:36px;border-radius:10px;flex:0 0 36px"></span><span style="flex:1;display:flex;flex-direction:column;gap:8px"><span class="sk" style="display:block;width:60%;height:12px;"></span><span class="sk" style="display:block;width:35%;height:10px;"></span></span></div><div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line,#2E2E29)"><span class="sk" style="display:block;width:36px;height:36px;border-radius:10px;flex:0 0 36px"></span><span style="flex:1;display:flex;flex-direction:column;gap:8px"><span class="sk" style="display:block;width:60%;height:12px;"></span><span class="sk" style="display:block;width:35%;height:10px;"></span></span></div></div>
    </div></template>
<template data-if value="{{ psError }}" hint-placeholder-val="{{ false }}"><div style="display:contents"><div class="pse" role="alert" style="padding:28px 20px;width:100%;box-sizing:border-box">
      <span class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg></span>
      <h2 style="margin:0;font-size:18px;line-height:28px;font-weight:600;color:var(--ink,#F3F3EE)">تعذّر تحميل البيانات</h2>
      <p style="margin:0;font-size:14px;line-height:22px;color:var(--muted,#A9A99F);max-width:420px">لم يصل رد من الخادم. تحقق من الاتصال ثم أعد المحاولة؛ لم يتغير شيء من بياناتك.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn btn-primary" type="button" onClick="{{ psRetry }}" style="height:42px;padding:0 18px;border-radius:10px;border:0;background:var(--primary,#FF6A30);color:#1A1A18;font-family:'Readex Pro',sans-serif;font-size:13.5px;font-weight:600;cursor:pointer">إعادة المحاولة</button></div>
    </div></div></template>
</main>
  <nav aria-label="التنقل" style="position:absolute;left:0;right:0;bottom:0;height:68px;background:#1B1B18;border-top:1px solid #2E2E29;display:flex;gap:4px;padding:8px 10px;box-sizing:border-box">
    <a class="bn" href="MemberHome.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/></svg>الرئيسية</a>
    <a class="bn" href="MemberCard.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M8 8h3v3H8zM13 13h3v3h-3z"/></svg>بطاقتي</a>
    <a class="bn" href="MemberMemberships.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>اشتراكاتي</a>
    <a class="bn" href="MemberAccount.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>حسابي</a>
  </nav>
</div>
</template>
<script type="application/json" id="dc-props">{"pageState": {"editor": "enum", "options": ["ready", "loading", "error"], "default": "ready", "section": "حالة الصفحة"}, "$preview": {"width": 390, "height": 1260}}</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const base = this.__ps();
    const ps = (this.state && this.state.__ps) || this.props.pageState || 'ready';
    return Object.assign({}, base, { psReady: ps === 'ready', psLoading: ps === 'loading', psError: ps === 'error', psRetry: () => this.setState({ __ps: 'ready' }) });
  }
  __ps() {
    const on = [1,3,5,8,9,11,13,15,17,18,20,22,24,26,27,29,31,33];
    const cal = Array.from({length:35}, (_, i) => ({ bg: on.includes(i) ? '#FF6A30' : '#24241F', bd: i === 33 ? '2px solid #C8F03C' : '0' }));
    const H = [['8',10],['10',6],['12',14],['14',8],['16',22],['18',100],['20',64],['22',12]];
    const ok = ['M5 12l4 4 10-10', '#3DD68C', '#163126'], no = ['M6 6l12 12M18 6L6 18', '#FF7A95', '#3A1520'];
    const L = (d, s, t, r) => ({ d, s, t, p: r[0], c: r[1], bg: r[2] });
    return {
      cal, hours: H.map(([l, v]) => ({ l, v, c: v === 100 ? '#FF6A30' : '#45453D' })),
      log: [
        L('اليوم', 'الفرع الرئيسي – المزة · QR', '18:42', ok),
        L('الإثنين 2 تشرين الثاني', 'الفرع الرئيسي – المزة · QR', '19:05', ok),
        L('السبت 31 تشرين الأول', 'فرع المالكي · يدوي', '18:10', ok),
        L('الخميس 29 تشرين الأول', 'خارج وقت قسم الذكور', '13:20', no),
        L('الأربعاء 28 تشرين الأول', 'الفرع الرئيسي – المزة · QR', '18:30', ok)
      ]
    };
  }
}
</script>
<script src="runtime.js"></script>
</body>
</html>
