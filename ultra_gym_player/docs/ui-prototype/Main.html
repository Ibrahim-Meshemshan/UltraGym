<style>

body{margin:0;background:#F5F5F2}
a{color:#B53D0A}a:hover{color:#8E2F06}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.cut{background:#E0E0DA;padding:1px;border-radius:16px;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.cut>.in{background:#FFFFFF;border-radius:15px;clip-path:polygon(0 0,calc(100% - 17.6px) 0,100% 17.6px,100% 100%,0 100%);height:100%;box-sizing:border-box}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}

.t-success{background:#E3F5EC;color:#0D7350}.t-warning{background:#FFF1D1;color:#8A5800}.t-danger{background:#FDE6EC;color:#B81F45}.t-info{background:#E6ECFF;color:#2A50C8}.t-accent{background:#EEF8D2;color:#4F7A00}.t-primary{background:#FFE8DC;color:#B53D0A}.t-neutral{background:#EDEDE8;color:#5F5F57}
.strike{text-decoration:line-through}
.btn{height:42px;padding:0 18px;border-radius:10px;font-family:'Readex Pro',sans-serif;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:8px;border:1px solid transparent;cursor:pointer;box-sizing:border-box}

.btn[disabled]{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12.5px;font-weight:500;color:#5F5F57}
.input{height:42px;border:1px solid #E0E0DA;border-radius:12px;background:#FFFFFF;padding:0 14px;font-family:'Readex Pro',sans-serif;font-size:14px;color:#1A1A17;box-sizing:border-box;width:100%}
.slab{width:36px;height:36px;border-radius:10px;background:#FFE8DC;color:#B53D0A;display:flex;align-items:center;justify-content:center;transform:skewX(-10deg)}
.slab>svg{transform:skewX(10deg)}
</style>
