<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تطبيق العضو · اشتراكاتي · UltraGym v1</title>
<style>
@font-face{font-family:'Changa';src:url(assets/Changa-VariableFont_wght.ttf) format('truetype');font-weight:200 800;font-display:swap}
@font-face{font-family:'Readex Pro';src:url(assets/ReadexPro-VariableFont_wght.ttf) format('truetype');font-weight:160 700;font-display:swap}
body{margin:0;background:#121210}
a{color:#FF8E5E;text-decoration:none}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.frame{background:#2E2E29;padding:1px;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px))}
.frame>.in{background:#1B1B18;clip-path:polygon(0 0,calc(100% - 21.6px) 0,100% 21.6px,100% 100%,21.6px 100%,0 calc(100% - 21.6px))}
.badge{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;height:52px;border-radius:14px;font-size:11.5px;color:#A9A99F}
.bn.on{background:#3A1C10;color:#FF8E5E;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;gap:10px}
.row>span:first-child{color:#A9A99F}
.card{background:#1B1B18;border:1px solid #2E2E29;border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.h2{margin:0;font-size:15px;line-height:24px;font-weight:600}
.bar{height:8px;border-radius:999px;background:#2E2E29;overflow:hidden}
.bar>i{display:block;height:100%;background:#C8F03C;border-radius:999px}

.sk{background:linear-gradient(90deg,var(--soft,#24241F) 25%,var(--line,#2E2E29) 37%,var(--soft,#24241F) 63%);background-size:400% 100%;animation:skm 1.4s ease infinite;border-radius:8px}
@keyframes skm{0%{background-position:100% 50%}100%{background-position:0 50%}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.pse{background:var(--surface,#1B1B18);border:1px solid var(--line,#2E2E29);border-radius:16px;padding:40px 24px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.pse .ico{width:56px;height:56px;border-radius:999px;background:var(--d-soft,#3A1520);color:var(--d-ink,#FF7A95);display:flex;align-items:center;justify-content:center}
</style>
<link rel="stylesheet" href="proto.css">
</head>
<body class="ug-mobile">
<div id="dc-root"></div>
<template id="dc-src">
<div style="width:390px;min-height:1360px;position:relative;background:#121210;font-family:'Readex Pro',sans-serif;color:#F3F3EE;direction:rtl;padding-bottom:84px;box-sizing:border-box">
  <header style="display:flex;align-items:center;justify-content:space-between;padding:18px 20px">
    <h1 style="margin:0;font-size:19px;line-height:30px;font-weight:600">اشتراكاتي</h1>
    <span style="font-size:12.5px;color:#A9A99F">نادي القمة الرياضي</span>
  </header>

  <main style="padding:4px 20px 0;display:flex;flex-direction:column;gap:16px">
<template data-if value="{{ psReady }}" hint-placeholder-val="{{ true }}"><div style="display:contents">
    <section class="frame"><div class="in" style="padding:20px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;align-items:center;gap:10px">
        <span style="flex:1;display:flex;flex-direction:column"><span style="font-size:12px;color:#A9A99F">الاشتراك الحالي</span><strong style="font-size:18px;font-weight:600">شهري · حديد</strong></span>
        <span class="badge" style="background:#163126;color:#3DD68C">فعّال</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:8px"><strong class="ltr" style="font-family:'Changa',sans-serif;font-size:44px;line-height:1;font-weight:700;color:#C8F03C">12</strong><span style="font-size:14px;color:#C9C9C0">يومًا متبقيًا</span></div>
      <div class="bar" role="img" aria-label="مضى 18 يومًا من 30"><i style="width:60%"></i></div>
      <div class="row"><span>من</span><span class="ltr">2026-10-17</span></div>
      <div class="row"><span>إلى</span><span class="ltr">2026-11-16</span></div>
      <div class="row"><span>الفرع</span><span>الفرع الرئيسي – المزة</span></div>
      <div class="row"><span>المدرب</span><span>باسل حداد</span></div>
      <div class="row"><span>أيام تجميد متاحة</span><span class="ltr">7</span></div>
      <div style="border-top:1px solid #2E2E29;padding-top:12px;display:flex;flex-direction:column;gap:8px">
        <div class="row"><span>السعر بعد الخصم</span><span class="ltr">$30.00</span></div>
        <div class="row"><span>المدفوع</span><span class="ltr" style="color:#3DD68C">$20.00</span></div>
        <div class="row"><strong style="font-weight:600;color:#F3F3EE">المتبقي عليك</strong><strong class="ltr" style="font-family:'Changa',sans-serif;font-size:20px;color:#F5B642">$10.00</strong></div>
      </div>
      <p style="margin:0;font-size:12.5px;line-height:20px;color:#A9A99F">ادفع المتبقي عند الاستقبال. لا يوجد دفع إلكتروني حاليًا.</p>
    </div></section>

    <section class="card" style="background:#1C2747;border-color:#1C2747">
      <div style="display:flex;align-items:center;gap:10px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8AA9FF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 14-5.3M20 12a8 8 0 0 1-14 5.3M18 3v4h-4M6 21v-4h4"/></svg><strong style="font-size:14px;font-weight:600;color:#F3F3EE">التجديد القادم</strong></div>
      <span style="font-size:13px;line-height:21px;color:#C9C9C0">ينتهي اشتراكك <span class="ltr">2026-11-16</span>. جدّد عند الاستقبال قبلها لتستمر بلا انقطاع.</span>
      <a href="MemberPlans.html" style="font-size:13px;font-weight:600;color:#8AA9FF">عرض خطط التجديد</a>
    </section>

    <section style="display:flex;flex-direction:column;gap:10px">
      <h2 class="h2">اشتراكات سابقة</h2>
      <template data-for list="{{ past }}" as="p" hint-placeholder-count="3">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center"><strong style="font-size:14px;font-weight:600">{{ p.plan }}</strong><span class="badge" style="{{ p.tone }}">{{ p.status }}</span></div>
          <div class="row"><span><span class="ltr">{{ p.from }}</span> ← <span class="ltr">{{ p.to }}</span></span><span class="ltr">{{ p.price }}</span></div>
        </div>
      </template>
    </section>

    <section style="display:flex;flex-direction:column;gap:10px">
      <h2 class="h2">دفعاتي وإيصالاتي</h2>
      <div class="card" style="padding:4px 16px">
        <template data-for list="{{ pays }}" as="p" hint-placeholder-count="4">
          <div style="display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #2E2E29">
            <span style="flex:1;display:flex;flex-direction:column"><strong class="ltr" style="font-size:14px;font-weight:600;align-self:flex-start">{{ p.amount }}</strong><span style="font-size:12px;color:#A9A99F"><span class="ltr">{{ p.day }}</span> · {{ p.kind }}</span></span>
            <a href="#" style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;height:34px;padding:0 12px;border:1px solid #45453D;border-radius:10px;color:#F3F3EE" aria-label="تنزيل إيصال {{ p.no }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>إيصال</a>
          </div>
        </template>
      </div>
    </section>
  </div></template>
<template data-if value="{{ psLoading }}" hint-placeholder-val="{{ false }}"><div style="display:contents" role="status" aria-live="polite"><span class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">جارٍ التحميل</span>
      <span class="sk" style="display:block;width:100%;height:150px;border-radius:18px"></span>
      <div style="display:flex;gap:10px"><span class="sk" style="display:block;width:100%;height:64px;border-radius:14px"></span><span class="sk" style="display:block;width:100%;height:64px;border-radius:14px"></span><span class="sk" style="display:block;width:100%;height:64px;border-radius:14px"></span></div>
      <div style="background:var(--surface,#1B1B18);border:1px solid var(--line,#2E2E29);border-radius:16px;overflow:hidden"><div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line,#2E2E29)"><span class="sk" style="display:block;width:36px;height:36px;border-radius:10px;flex:0 0 36px"></span><span style="flex:1;display:flex;flex-direction:column;gap:8px"><span class="sk" style="display:block;width:60%;height:12px;"></span><span class="sk" style="display:block;width:35%;height:10px;"></span></span></div><div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line,#2E2E29)"><span class="sk" style="display:block;width:36px;height:36px;border-radius:10px;flex:0 0 36px"></span><span style="flex:1;display:flex;flex-direction:column;gap:8px"><span class="sk" style="display:block;width:60%;height:12px;"></span><span class="sk" style="display:block;width:35%;height:10px;"></span></span></div><div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line,#2E2E29)"><span class="sk" style="display:block;width:36px;height:36px;border-radius:10px;flex:0 0 36px"></span><span style="flex:1;display:flex;flex-direction:column;gap:8px"><span class="sk" style="display:block;width:60%;height:12px;"></span><span class="sk" style="display:block;width:35%;height:10px;"></span></span></div><div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-top:1px solid var(--line,#2E2E29)"><span class="sk" style="display:block;width:36px;height:36px;border-radius:10px;flex:0 0 36px"></span><span style="flex:1;display:flex;flex-direction:column;gap:8px"><span class="sk" style="display:block;width:60%;height:12px;"></span><span class="sk" style="display:block;width:35%;height:10px;"></span></span></div></div>
    </div></template>
<template data-if value="{{ psError }}" hint-placeholder-val="{{ false }}"><div style="display:contents"><div class="pse" role="alert" style="padding:28px 20px;width:100%;box-sizing:border-box">
      <span class="ico"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l9 16H3z"/><path d="M12 10v4M12 17h.01"/></svg></span>
      <h2 style="margin:0;font-size:18px;line-height:28px;font-weight:600;color:var(--ink,#F3F3EE)">تعذّر تحميل البيانات</h2>
      <p style="margin:0;font-size:14px;line-height:22px;color:var(--muted,#A9A99F);max-width:420px">لم يصل رد من الخادم. تحقق من الاتصال ثم أعد المحاولة؛ لم يتغير شيء من بياناتك.</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button class="btn btn-primary" type="button" onClick="{{ psRetry }}" style="height:42px;padding:0 18px;border-radius:10px;border:0;background:var(--primary,#FF6A30);color:#1A1A18;font-family:'Readex Pro',sans-serif;font-size:13.5px;font-weight:600;cursor:pointer">إعادة المحاولة</button></div>
    </div></div></template>
</main>

  <nav aria-label="التنقل" style="position:absolute;left:0;right:0;bottom:0;height:68px;background:#1B1B18;border-top:1px solid #2E2E29;display:flex;gap:4px;padding:8px 10px;box-sizing:border-box">
    <a class="bn" href="MemberHome.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/></svg>الرئيسية</a>
    <a class="bn" href="MemberCard.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V4h4M16 4h4v4M20 16v4h-4M8 20H4v-4M8 8h3v3H8zM13 13h3v3h-3z"/></svg>بطاقتي</a>
    <a class="bn on" href="MemberMemberships.html" aria-current="page"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>اشتراكاتي</a>
    <a class="bn" href="MemberAccount.html"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>حسابي</a>
  </nav>
</div>
</template>
<script type="application/json" id="dc-props">{"pageState": {"editor": "enum", "options": ["ready", "loading", "error"], "default": "ready", "section": "حالة الصفحة"}, "$preview": {"width": 390, "height": 1360}}</script>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const base = this.__ps();
    const ps = (this.state && this.state.__ps) || this.props.pageState || 'ready';
    return Object.assign({}, base, { psReady: ps === 'ready', psLoading: ps === 'loading', psError: ps === 'error', psRetry: () => this.setState({ __ps: 'ready' }) });
  }
  __ps() {
    const done = 'background:#24241F;color:#A9A99F', cancelled = 'background:#3A1520;color:#FF7A95';
    return {
      past: [
        { plan: 'شهري · حديد', status: 'منتهٍ', tone: done, from: '2026-09-17', to: '2026-10-16', price: '$30.00' },
        { plan: 'شهري · حديد', status: 'منتهٍ', tone: done, from: '2026-08-15', to: '2026-09-14', price: '$30.00' },
        { plan: 'أسبوعي', status: 'ملغى', tone: cancelled, from: '2026-08-01', to: '2026-08-07', price: '$10.00' }
      ],
      pays: [
        { amount: '$20.00', day: '2026-10-17', kind: 'دفعة اشتراك', no: 'B1-2026-010877' },
        { amount: '375,000 ل.س', day: '2026-09-17', kind: 'دفعة اشتراك', no: 'B1-2026-009512' },
        { amount: '$15.00', day: '2026-08-20', kind: 'دفعة اشتراك', no: 'B1-2026-008340' },
        { amount: '$15.00', day: '2026-08-15', kind: 'دفعة اشتراك', no: 'B1-2026-008101' }
      ]
    };
  }
}
</script>
<script src="runtime.js"></script>
</body>
</html>
